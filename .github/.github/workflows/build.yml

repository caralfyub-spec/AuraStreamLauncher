name: Compilar APK Directo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Leer archivos
        uses: actions/checkout@v4

      - name: 2. Activar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.5 compatible
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Limpiar conflictos y construir APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: 5. Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Aura Stream v1.0.${{ github.run_number }} - Curva C Mágica"
          body: "Versión pública de Aura Stream con motor gestual en curva C mágica, letras en las esquinas, línea guía sutil y temas personalizables."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
