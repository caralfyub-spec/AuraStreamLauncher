          @Composable
          fun NiagaraVideoAppRow(
              app: AppItem,
              textColor: Color,
              iconPackMode: String,
              iconSizeDp: Float,
              hideName: Boolean,
              horizontalShiftDp: Float,
              onClick: () -> Unit,
              onLongClick: () -> Unit
          ) {
              // Transforma automáticamente cualquier icono en Blanco Minimal (Simply Minimal) o Negro Puro (Pure Essence)
              val iconColorFilter = remember(iconPackMode) {
                  when (iconPackMode) {
                      "white_minimal" -> ColorFilter.colorMatrix(
                          ColorMatrix(
                              floatArrayOf(
                                  0f, 0f, 0f, 0f, 255f,
                                  0f, 0f, 0f, 0f, 255f,
                                  0f, 0f, 0f, 0f, 255f,
                                  0f, 0f, 0f, 1f, 0f
                              )
                          )
                      )
                      "black_essence" -> ColorFilter.colorMatrix(
                          ColorMatrix(
                              floatArrayOf(
                                  0f, 0f, 0f, 0f, 18f,
                                  0f, 0f, 0f, 0f, 24f,
                                  0f, 0f, 0f, 0f, 39f,
                                  0f, 0f, 0f, 1f, 0f
                              )
                          )
                      )
                      else -> null
                  }
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .offset(x = horizontalShiftDp.dp)
                      .clip(RoundedCornerShape(14.dp))
                      .pointerInput(app.packageName) {
                          detectTapGestures(
                              onTap = { onClick() },
                              onLongPress = { onLongClick() }
                          )
                      }
                      .padding(horizontal = 4.dp, vertical = 7.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (iconPackMode == "default" && app.icon != null) {
                      Image(
                          bitmap = app.icon.asImageBitmap(),
                          contentDescription = null,
                          modifier = Modifier
                              .size(iconSizeDp.dp)
                              .clip(RoundedCornerShape(10.dp))
                      )
                  } else {
                      // Icono minimalista vectorial estilo Simply Minimal White / Pure Essence Black (05:38 y 09:11)
                      val glyphColor = if (iconPackMode == "black_essence") Color(0xFF111827) else Color.White
                      Box(
                          modifier = Modifier
                              .size(iconSizeDp.dp)
                              .border(1.8.dp, glyphColor, CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          if (app.icon != null && iconColorFilter != null) {
                              Image(
                                  bitmap = app.icon.asImageBitmap(),
                                  contentDescription = null,
                                  colorFilter = iconColorFilter,
                                  modifier = Modifier
                                      .size((iconSizeDp * 0.58f).dp)
                                      .clip(CircleShape)
                              )
                          } else {
                              Text(
                                  text = app.initial.toString(),
                                  color = glyphColor,
                                  fontSize = 14.sp,
                                  fontWeight = FontWeight.Bold
                              )
                          }
                      }
                  }

                  if (!hideName) {
                      Spacer(modifier = Modifier.width(16.dp))
                      Text(
                          text = app.label,
                          color = textColor,
                          fontSize = 16.sp,
                          fontWeight = FontWeight.Medium,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

          fun launchApp(context: Context, packageName: String) {
              context.packageManager.getLaunchIntentForPackage(packageName)?.let {
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(it)
              }
          }

          fun drawableToBitmap(drawable: Drawable): Bitmap {
              if (drawable is BitmapDrawable && drawable.bitmap != null) return drawable.bitmap
              val w = if (drawable.intrinsicWidth > 0) drawable.intrinsicWidth else 96
              val h = if (drawable.intrinsicHeight > 0) drawable.intrinsicHeight else 96
              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              val canvas = AndroidCanvas(bmp)
              drawable.setBounds(0, 0, canvas.width, canvas.height)
              drawable.draw(canvas)
              return bmp
          }
