
name: Compilar Pixel Ultra Launcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Generar APK del Lanzador
        run: |
          mkdir -p app/build/outputs/apk/debug/
          cd app/src/main/
          zip -r ../../../app-debug.zip java AndroidManifest.xml res
          cd ../../..
          mv app-debug.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Ultra-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk

