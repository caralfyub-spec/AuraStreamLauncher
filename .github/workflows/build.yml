              val topWaveY = h * 0.20f
              val bottomWaveY = h * 0.85f

              val wavePoints = remember(containerSize, touchY, waveOnLeft) {
                  val total = NIAGARA_INDEX.size
                  val safeTotal = if (total > 1) total - 1 else 1
                  val maxWaveShift = with(density) { 68.dp.toPx() }
                  val waveRadius = with(density) { 120.dp.toPx() }

                  NIAGARA_INDEX.indices.map { i ->
                      val t = i.toFloat() / safeTotal.toFloat()
                      val baseY = topWaveY + t * (bottomWaveY - topWaveY)
                      val baseX = if (waveOnLeft) {
                          with(density) { 24.dp.toPx() }
                      } else {
                          w - with(density) { 24.dp.toPx() }
                      }

                      val currentTouchY = touchY
                      val shift = if (currentTouchY != null) {
                          val distY = abs(baseY - currentTouchY)
                          if (distY < waveRadius) {
                              val factor = (1f + cos((distY / waveRadius) * PI.toFloat())) / 2f
                              factor * maxWaveShift
                          } else {
                              0f
                          }
                      } else {
                          0f
                      }

                      val finalX = if (waveOnLeft) baseX + shift else baseX - shift
                      Offset(finalX, baseY)
                  }
              }

              fun handleWaveTouch(yPos: Float) {
                  touchY = yPos
                  val clampedY = yPos.coerceIn(topWaveY, bottomWaveY)
                  val fraction = (clampedY - topWaveY) / (bottomWaveY - topWaveY).coerceAtLeast(1f)
                  val idx = (fraction * (NIAGARA_INDEX.size - 1)).roundToInt()
                      .coerceIn(0, NIAGARA_INDEX.size - 1)

                  if (activeWaveIndex != idx) {
                      activeWaveIndex = idx
                      activeChar = NIAGARA_INDEX[idx]
                      isSearching = false
                      searchQuery = ""
                      view.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                  }
              }

