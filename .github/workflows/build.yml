                                  showNiagaraWidgetSheet = true
                              },
                              onTap = {
                                  if (isMovingWidgetMode) isMovingWidgetMode = false
                              }
                          )
                      }
                      .pointerInput(Unit) {
                          var totalDy = 0f
                          detectVerticalDragGestures(
                              onDragStart = { totalDy = 0f },
                              onVerticalDrag = { _, dragAmount -> totalDy += dragAmount },
                              onDragEnd = {
                                  if (totalDy < -90f && !isSearching) {
                                      isSearching = true
                                  } else if (totalDy > 90f && !isSearching) {
                                      expandStatusBar(context)
                                  }
                              }
                          )
                      }
              ) {
                  if (wallpaperStyle == "custom_gallery" && customWallpaperBitmap != null) {
                      Image(
