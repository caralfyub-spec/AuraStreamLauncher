                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(12.dp))
                                      .background(if (iconPackMode == id) Color(0xFF0284C7) else Color(0xFF1E293B))
                                      .clickable {
                                          iconPackMode = id
                                          prefs.edit().putString("icon_pack", id).apply()
                                      }
                                      .padding(12.dp)
                              ) {
                                  Text(title, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Medium)
                              }
                          }
                      }

                      Text("Tamaño de los iconos: ${iconSizeDp.roundToInt()} dp", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                      Slider(
                          value = iconSizeDp,
                          onValueChange = {
                              iconSizeDp = it
                              prefs.edit().putFloat("icon_size", it).apply()
                          },
                          valueRange = 32f..64f
                      )

                      Text("Color del texto de las aplicaciones:", color = Color(0xFFFFD700), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf(
                              "light" to "Claro (Blanco)",
                              "dark" to "Oscuro (Negro)",
                              "auto" to "Automático"
                          ).forEach { (id, label) ->
                              Box(
                                  modifier = Modifier
                                      .weight(1f)
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(if (textColorMode == id) Color(0xFFFFD700) else Color(0xFF1E293B))
                                      .clickable {
                                          textColorMode = id
                                          prefs.edit().putString("text_color_mode", id).apply()
                                      }
                                      .padding(vertical = 10.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(label, color = if (textColorMode == id) Color.Black else Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text("Ocultar alfabeto en reposo", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Medium)
                              Text("Muestra las letras solo al deslizar por el borde", color = Color.Gray, fontSize = 12.sp)
                          }
                          Switch(
                              checked = hideAlphabet,
                              onCheckedChange = {
                                  hideAlphabet = it
                                  prefs.edit().putBoolean("hide_alphabet", it).apply()
                              }
                          )
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text("Ocultar nombres de favoritos", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Medium)
                              Text("Muestra únicamente los iconos en la pantalla principal", color = Color.Gray, fontSize = 12.sp)
                          }
                          Switch(
                              checked = hideFavoriteNames,
                              onCheckedChange = {
                                  hideFavoriteNames = it
                                  prefs.edit().putBoolean("hide_fav_names", it).apply()
                              }
                          )
                      }

                      Button(
                          onClick = { currentScreen = "HOME" },
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFD700)),
                          shape = RoundedCornerShape(24.dp),
                          modifier = Modifier.fillMaxWidth().height(50.dp)
                      ) {
                          Text("Aplicar y volver al Inicio", color = Color.Black, fontWeight = FontWeight.Bold)
                      }
                  }
                  return
              }

              // =========================================================================
              // PANTALLA 7: ESCRITORIO PRINCIPAL (HOME)
              // =========================================================================
              val favoriteApps = remember(apps, favoritePackages) {
                  favoritePackages.mapNotNull { pkg -> apps.find { it.packageName == pkg } }
              }

              val displayedApps = remember(apps, favoriteApps, searchQuery, isSearching, activeChar) {
                  when {
                      isSearching && searchQuery.isNotBlank() ->
                          apps.filter { it.label.contains(searchQuery.trim(), ignoreCase = true) }
                      isSearching -> apps
                      activeChar == '★' -> favoriteApps
                      else -> {
                          val exact = apps.filter { it.initial == activeChar }
                          if (exact.isNotEmpty()) exact else apps
                      }
                  }
              }

              val w = containerSize.width.toFloat().coerceAtLeast(1f)
              val h = containerSize.height.toFloat().coerceAtLeast(1f)
              val topWaveY = h * 0.20f
              val bottomWaveY = h * 0.85f

              val wavePoints = remember(containerSize, touchY, waveOnLeft) {
                  val total = LINCE_INDEX.size
                  val safeTotal = if (total > 1) total - 1 else 1
                  val maxWaveShift = with(density) { 68.dp.toPx() }
                  val waveRadius = with(density) { 120.dp.toPx() }

                  LINCE_INDEX.indices.map { i ->
                      val t = i.toFloat() / safeTotal.toFloat()
                      val baseY = topWaveY + t * (bottomWaveY - topWaveY)
                      val baseX = if (waveOnLeft) {
                          with(density) { 24.dp.toPx() }
                      } else {
                          w - with(density) { 24.dp.toPx() }
                      }

                      val currentTouchY = touchY
                      val shift = if (currentTouchY != null) {
                          val distY = abs(baseY - currentTouchY)
                          if (distY < waveRadius) {
                              val factor = (1f + cos((distY / waveRadius) * PI.toFloat())) / 2f
                              factor * maxWaveShift
                          } else {
                              0f
                          }
                      } else {
                          0f
                      }

                      val finalX = if (waveOnLeft) baseX + shift else baseX - shift
                      Offset(finalX, baseY)
                  }
              }

              fun handleWaveTouch(yPos: Float) {
                  touchY = yPos
                  val clampedY = yPos.coerceIn(topWaveY, bottomWaveY)
                  val fraction = (clampedY - topWaveY) / (bottomWaveY - topWaveY).coerceAtLeast(1f)
                  val idx = (fraction * (LINCE_INDEX.size - 1)).roundToInt()
                      .coerceIn(0, LINCE_INDEX.size - 1)

                  if (activeWaveIndex != idx) {
                      activeWaveIndex = idx
                      activeChar = LINCE_INDEX[idx]
                      isSearching = false
                      searchQuery = ""
                      view.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .onSizeChanged { containerSize = it }
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onLongPress = {
                                  view.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                  showLinceWidgetSheet = true
                              },
                              onTap = {
                                  if (isMovingWidgetMode) isMovingWidgetMode = false
                              }
                          )
                      }
                      .pointerInput(Unit) {
                          var totalDy = 0f
                          detectVerticalDragGestures(
                              onDragStart = { totalDy = 0f },
                              onVerticalDrag = { _, dragAmount -> totalDy += dragAmount },
                              onDragEnd = {
                                  if (totalDy < -90f && !isSearching) {
                                      isSearching = true
                                  } else if (totalDy > 90f && !isSearching) {
                                      expandStatusBar(context)
                                  }
                              }
                          )
                      }
              ) {
                  // 1. FONDOS DE PANTALLA (LINCE LUMINOSO + EGIPTO + DISEÑOS CLÁSICOS DEL VÍDEO)
                  if (wallpaperStyle == "custom_gallery" && customWallpaperBitmap != null) {
                      Image(
                          bitmap = customWallpaperBitmap!!.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          val cw = size.width
                          val ch = size.height

                          when (wallpaperStyle) {
                              "sierra_andujar" -> {
                                  // SIERRA DE ANDÚJAR SOLEADA (MUY LUMINOSO Y VIVO)
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(
                                              Color(0xFF0284C7), // Cielo azul vivo arriba
                                              Color(0xFF38BDF8), // Cielo celeste luminoso
                                              Color(0xFFBAE6FD), // Horizonte claro
                                              Color(0xFFFDE68A)  // Luz solar cálida
                                          ),
                                          startY = 0f,
                                          endY = ch * 0.62f
                                      )
                                  )
                                  // Sol radiante de la sierra
                                  drawCircle(
                                      brush = Brush.radialGradient(
                                          colors = listOf(Color(0xFFFFFBEB), Color(0xFFFDE047).copy(alpha = 0.55f), Color.Transparent),
                                          center = Offset(cw * 0.72f, ch * 0.22f),
                                          radius = cw * 0.45f
                                      ),
                                      radius = cw * 0.45f,
                                      center = Offset(cw * 0.72f, ch * 0.22f)
                                  )
                                  // Colinas verdes luminosas de encinas y pinos
                                  val hillsBack = Path().apply {
                                      moveTo(0f, ch * 0.54f)
                                      quadraticBezierTo(cw * 0.35f, ch * 0.46f, cw * 0.7f, ch * 0.53f)
                                      quadraticBezierTo(cw * 0.88f, ch * 0.56f, cw, ch * 0.50f)
                                      lineTo(cw, ch)
                                      lineTo(0f, ch)
                                      close()
                                  }
                                  drawPath(hillsBack, Color(0xFF15803D))

                                  val hillsFront = Path().apply {
                                      moveTo(0f, ch * 0.66f)
                                      quadraticBezierTo(cw * 0.4f, ch * 0.60f, cw, ch * 0.68f)
                                      lineTo(cw, ch)
                                      lineTo(0f, ch)
                                      close()
                                  }
                                  drawPath(
                                      path = hillsFront,
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF166534), Color(0xFF064E3B)),
                                          startY = ch * 0.60f,
                                          endY = ch
                                      )
                                  )
                                  // Lince Ibérico ilustrado a todo color (Ocre, Ámbar, Blanco y Motas)
                                  drawBrightLynxIllustration(this, Offset(cw * 0.52f, ch * 0.52f), cw * 0.44f)
                              }
                              "ocaso_donana" -> {
                                  // MARISMAS DE DOÑANA AL SOL (DORADO, CORAL Y LAGUNA TURQUESA)
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(
                                              Color(0xFFEA580C),
                                              Color(0xFFFB923C),
                                              Color(0xFFFDE047),
                                              Color(0xFFFEF08A)
                                          ),
                                          startY = 0f,
                                          endY = ch * 0.60f
                                      )
                                  )
                                  drawCircle(
                                      color = Color(0xFFFFFBEB).copy(alpha = 0.9f),
                                      radius = cw * 0.16f,
                                      center = Offset(cw * 0.65f, ch * 0.32f)
                                  )
                                  // Agua luminosa de las marismas de Doñana
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF0D9488), Color(0xFF0F766E), Color(0xFF115E59)),
                                          startY = ch * 0.58f,
                                          endY = ch
                                      ),
                                      topLeft = Offset(0f, ch * 0.58f),
                                      size = Size(cw, ch * 0.42f)
                                  )
                                  // Lince Ibérico a todo color
                                  drawBrightLynxIllustration(this, Offset(cw * 0.52f, ch * 0.52f), cw * 0.44f)
                              }
                              "lince_esmeralda" -> {
                                  // BOSQUE ESMERALDA LUMINOSO DE PRIMAVERA
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(
                                              Color(0xFF10B981),
                                              Color(0xFF059669),
                                              Color(0xFF047857),
                                              Color(0xFF064E3B)
                                          )
                                      )
                                  )
                                  drawCircle(
                                      brush = Brush.radialGradient(
                                          colors = listOf(Color(0xFFA7F3D0).copy(alpha = 0.45f), Color.Transparent),
                                          center = Offset(cw * 0.7f, ch * 0.25f),
                                          radius = cw * 0.5f
                                      ),
                                      radius = cw * 0.5f,
                                      center = Offset(cw * 0.7f, ch * 0.25f)
                                  )
                                  drawBrightLynxIllustration(this, Offset(cw * 0.52f, ch * 0.52f), cw * 0.44f)
                              }
                              "nilo_piramides" -> {
                                  drawEgyptianNileWallpaper(this, cw, ch, isNight = false)
                              }
                              "noche_faraonica" -> {
                                  drawEgyptianNileWallpaper(this, cw, ch, isNight = true)
                              }
                              "dark_beach" -> {
                                  // DISEÑO 1 DEL VÍDEO: COSTA ARENA NEGRA Y ESPUMA
                                  drawRect(color = Color(0xFF050507))
                                  val foamPath = Path().apply {
                                      moveTo(cw * 0.68f, 0f)
                                      var y = 0f
                                      while (y <= ch) {
                                          val waveX = cw * 0.68f + sin(y * 0.012f) * (cw * 0.045f) + cos(y * 0.03f) * (cw * 0.02f)
                                          lineTo(waveX, y)
                                          y += 20f
                                      }
                                      lineTo(cw, ch)
                                      lineTo(cw, 0f)
                                      close()
                                  }
                                  drawPath(
                                      path = foamPath,
                                      brush = Brush.horizontalGradient(
                                          colors = listOf(Color(0xFF1F242D), Color(0xFF0F1318), Color(0xFF282E38)),
                                          startX = cw * 0.65f,
                                          endX = cw
                                      )
                                  )
                                  val shoreLine = Path().apply {
                                      moveTo(cw * 0.68f, 0f)
                                      var y = 0f
                                      while (y <= ch) {
                                          val waveX = cw * 0.68f + sin(y * 0.012f) * (cw * 0.045f) + cos(y * 0.03f) * (cw * 0.02f)
                                          lineTo(waveX, y)
                                          y += 15f
                                      }
                                  }
                                  drawPath(
                                      path = shoreLine,
                                      color = Color.White.copy(alpha = 0.38f),
                                      style = Stroke(width = 3.dp.toPx(), cap = StrokeCap.Round)
                                  )
                              }
                              "split_waves" -> {
                                  // DISEÑO 2 DEL VÍDEO: MITAD BLANCO MARFIL / MITAD OLAS AZULES JAPONESAS
                                  val splitX = cw * 0.53f
                                  drawRect(color = Color(0xFFF5F5F4))
                                  drawRect(
                                      color = Color(0xFF1D5B96),
                                      topLeft = Offset(splitX, 0f),
                                      size = Size(cw - splitX, ch)
                                  )
                                  val waveCenters = listOf(
                                      Offset(cw * 0.65f, ch * 0.12f),
                                      Offset(cw * 0.88f, ch * 0.25f),
                                      Offset(cw * 0.62f, ch * 0.42f),
                                      Offset(cw * 0.90f, ch * 0.58f),
                                      Offset(cw * 0.66f, ch * 0.74f),
                                      Offset(cw * 0.86f, ch * 0.90f)
                                  )
                                  waveCenters.forEach { center ->
                                      for (r in 5 downTo 1) {
                                          val radius = r * (cw * 0.065f)
                                          drawCircle(
                                              color = if (r % 2 == 0) Color(0xFF0F3C69) else Color(0xFF3882C4),
                                              radius = radius,
                                              center = center
                                          )
                                          drawCircle(
                                              color = Color(0xFFF5F5F4).copy(alpha = 0.85f),
                                              radius = radius,
                                              center = center,
                                              style = Stroke(width = 2.5.dp.toPx())
                                          )
                                      }
                                  }
                                  drawRect(
                                      color = Color(0xFFF5F5F4),
                                      topLeft = Offset(0f, 0f),
                                      size = Size(splitX, ch)
                                  )
                              }
                              "purple_swirl" -> {
                                  // NIAGARA ORIGINAL PURPLE SWIRL
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF7E60BF), Color(0xFF433878), Color(0xFF1E1B4B))
                                      )
                                  )
                                  drawCircle(
                                      color = Color(0xFFC4B5FD).copy(alpha = 0.22f),
                                      radius = cw * 0.65f,
                                      center = Offset(cw * 0.6f, ch * 0.45f)
                                  )
                              }
                              else -> {
                                  // MIRADA NOCTURNA OLED
                                  drawRect(color = Color(0xFF000000))
                                  val leftEye = Offset(cw * 0.62f, ch * 0.35f)
                                  val rightEye = Offset(cw * 0.78f, ch * 0.35f)
                                  drawCircle(Color(0xFFFFD700).copy(alpha = 0.8f), radius = 16f, center = leftEye)
                                  drawCircle(Color(0xFFFFD700).copy(alpha = 0.8f), radius = 16f, center = rightEye)
                                  drawCircle(Color.Black, radius = 4f, center = leftEye)
                                  drawCircle(Color.Black, radius = 4f, center = rightEye)
                              }
                          }
                      }
                  }

                  // LÍNEA GUÍA COLOREADA DE LA OLA ALFABÉTICA
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      if (!hideAlphabet || touchY != null) {
                          for (i in 0 until (wavePoints.size - 1)) {
                              val segColor = getWaveLetterColor(waveColorMode, i, accentColor)
                              drawLine(
                                  color = segColor.copy(alpha = if (touchY != null) 0.55f else 0.22f),
                                  start = wavePoints[i],
                                  end = wavePoints[i + 1],
                                  strokeWidth = if (touchY != null) 3.5.dp.toPx() else 1.8.dp.toPx(),
                                  cap = StrokeCap.Round
                              )
                          }
                      }
                  }

                  // 2. CAPA DE INTERFAZ Y LOS 10 RELOJES / WIDGETS
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(
                              start = if (waveOnLeft) 60.dp else 26.dp,
                              end = if (waveOnLeft) 26.dp else 56.dp,
                              top = 12.dp,
                              bottom = 12.dp
                          )
                  ) {
                      if (isMovingWidgetMode) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(16.dp))
                                  .background(Color(0xEE111827))
                                  .border(1.dp, accentColor, RoundedCornerShape(16.dp))
                                  .padding(14.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("↕ Arrastra para mover el reloj y las apps", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                  TextButton(onClick = { isMovingWidgetMode = false }) {
                                      Text("Hecho", color = accentColor, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Slider(
                                  value = verticalOffsetDp,
                                  onValueChange = {
                                      verticalOffsetDp = it
                                      prefs.edit().putFloat("vertical_offset", it).apply()
                                  },
                                  valueRange = 0f..200f
                              )
                          }
                          Spacer(modifier = Modifier.height(8.dp))
                      }

                      Spacer(modifier = Modifier.height(verticalOffsetDp.dp))

                      // CATÁLOGO DE 9 RELOJES Y WIDGETS ESPECIALES (LINCE + EGIPTO + KWGT DEL VÍDEO)
                      if (linceClockStyle > 0 && !isSearching && activeChar == '★') {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(bottom = 18.dp)
                                  .pointerInput(Unit) {
                                      detectTapGestures(
                                          onTap = { showLinceClockPicker = true },
                                          onLongPress = { showLinceWidgetSheet = true }
                                      )
                                  },
                              contentAlignment = Alignment.CenterStart
                          ) {
                              when (linceClockStyle) {
                                  1 -> {
                                      // 1. RELOJ OREJAS DE LINCE (LUMINOSO)
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Canvas(modifier = Modifier.size(128.dp)) {
                                              val center = Offset(size.width / 2f, size.height / 2f)
                                              val r = size.width / 2f
                                              drawCircle(Color(0xAA0F172A), radius = r)
                                              drawCircle(Color(0xFFFFD700), radius = r, style = Stroke(width = 2.5.dp.toPx()))

                                              val earsBg = Path().apply {
                                                  moveTo(center.x - 30f, center.y - 10f)
                                                  lineTo(center.x - 50f, center.y - r * 0.85f)
                                                  lineTo(center.x - 10f, center.y - 20f)
                                                  moveTo(center.x + 30f, center.y - 10f)
                                                  lineTo(center.x + 50f, center.y - r * 0.85f)
                                                  lineTo(center.x + 10f, center.y - 20f)
                                              }
                                              drawPath(earsBg, Color(0xFFF59E0B).copy(alpha = 0.55f), style = Stroke(width = 2.dp.toPx()))

                                              drawCircle(Color(0xFFFFD700), radius = 4f, center = Offset(center.x, center.y - r + 15f))
                                              drawCircle(Color(0xFFFFD700), radius = 4f, center = Offset(center.x + r - 15f, center.y))
                                              drawCircle(Color(0xFFFFD700), radius = 4f, center = Offset(center.x, center.y + r - 15f))
                                              drawCircle(Color(0xFFFFD700), radius = 4f, center = Offset(center.x - r + 15f, center.y))

                                              val hAngle = ((hourFloat % 12f) * 30f - 90f) * (PI.toFloat() / 180f)
                                              val hEnd = Offset(center.x + cos(hAngle) * (r * 0.48f), center.y + sin(hAngle) * (r * 0.48f))
                                              drawLine(Color(0xFFFFD700), start = center, end = hEnd, strokeWidth = 4.dp.toPx(), cap = StrokeCap.Round)

                                              val mAngle = (minuteFloat * 6f - 90f) * (PI.toFloat() / 180f)
                                              val mEnd = Offset(center.x + cos(mAngle) * (r * 0.72f), center.y + sin(mAngle) * (r * 0.72f))
                                              drawLine(Color.White, start = center, end = mEnd, strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round)
                                              drawLine(Color(0xFFFFD700), mEnd, mEnd + Offset(cos(mAngle + 0.5f) * 12f, sin(mAngle + 0.5f) * 12f), strokeWidth = 2f)
                                              drawLine(Color(0xFFFFD700), mEnd, mEnd + Offset(cos(mAngle - 0.5f) * 12f, sin(mAngle - 0.5f) * 12f), strokeWidth = 2f)

                                              drawCircle(Color(0xFFFFD700), radius = 4.dp.toPx(), center = center)
                                          }
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(16.dp))
                                                  .background(Color(0xAA0F172A))
                                                  .padding(horizontal = 14.dp, vertical = 4.dp)
                                          ) {
                                              Text(
                                                  text = "🐾 LINCE IBÉRICO • $currentTime",
                                                  color = Color(0xFFFEF08A),
                                                  fontSize = 12.sp,
                                                  fontWeight = FontWeight.Bold
                                              )
                                          }
                                      }
                                  }
                                  2 -> {
                                      // 2. RELOJ HUELLA SALVAJE
                                      Box(
                                          modifier = Modifier
                                              .size(116.dp)
                                              .clip(CircleShape)
                                              .background(Color(0xAA0F172A))
                                              .border(2.dp, Color(0xFFFFD700), CircleShape),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                              Text("🐾", fontSize = 20.sp)
                                              Text(
                                                  text = currentTime,
                                                  color = Color.White,
                                                  fontSize = 26.sp,
                                                  fontWeight = FontWeight.ExtraBold
                                              )
                                              Text(
                                                  text = "🔋 $batteryLevel%",
                                                  color = Color(0xFFFEF08A),
                                                  fontSize = 10.sp,
                                                  fontWeight = FontWeight.Bold
                                              )
                                          }
                                      }
                                  }
                                  3 -> {
                                      // 3. RELOJ MIRADA DE DOÑANA
                                      Row(
                                          verticalAlignment = Alignment.CenterVertically,
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(18.dp))
                                              .background(Color(0xAA0F172A))
                                              .border(1.5.dp, Color(0xFFFFD700), RoundedCornerShape(18.dp))
                                              .padding(14.dp)
                                      ) {
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(12.dp))
                                                  .background(Color(0xFFFFD700))
                                                  .padding(horizontal = 14.dp, vertical = 8.dp)
                                          ) {
                                              Text(
                                                  text = currentDayNumber,
