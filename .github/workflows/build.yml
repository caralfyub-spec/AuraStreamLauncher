              if (currentScreen == "APPEARANCE") {
                  Column(modifier = Modifier.fillMaxSize().background(Color(0xFF0F172A)).statusBarsPadding().navigationBarsPadding().verticalScroll(rememberScrollState()).padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = { currentScreen = "SETTINGS" }) { Icon(Icons.Default.ArrowBack, contentDescription = null, tint = Color.White) }
                          Text("Apariencia y Colores", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      }
                      Text("Color de la Barra de Letras:", color = Color(0xFF38BDF8), fontWeight = FontWeight.Bold)
                      WAVE_COLOR_OPTIONS.forEach { (id, label, col) ->
                          Row(
                              modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(if (waveColorMode == id) Color(0xFF334155) else Color(0xFF1E293B)).border(1.5.dp, col, RoundedCornerShape(12.dp))
                                  .clickable { waveColorMode = id; prefs.edit().putString("wave_color_mode", id).apply() }.padding(10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(modifier = Modifier.size(20.dp).clip(CircleShape).background(col))
                              Spacer(modifier = Modifier.width(10.dp))
                              Text(label, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                      Text("Paquete de iconos:", color = Color(0xFF38BDF8), fontWeight = FontWeight.Bold)
                      listOf(
                          "black_essence" to "⚫ Pure Essence Black (Ideal para fondos claros del Lince y Olas)",
                          "white_minimal" to "⚪ Simply Minimal White (Blancos luminosos)",
                          "gold_pharaoh" to "🟡 Oro Real Faraónico",
                          "neon_cyan" to "🟠 Contorno Ámbar Lince",
                          "default" to "🎨 Iconos originales a todo color"
                      ).forEach { (id, title) ->
                          Box(
                              modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(if (iconPackMode == id) Color(0xFF0284C7) else Color(0xFF1E293B))
                                  .clickable { iconPackMode = id; prefs.edit().putString("icon_pack", id).apply() }.padding(12.dp)
                          ) {
                              Text(title, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                          }
                      }
                      Text("Color del texto de las aplicaciones:", color = Color(0xFF38BDF8), fontWeight = FontWeight.Bold)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("dark" to "Oscuro (Para fondos claros)", "light" to "Claro (Blanco)").forEach { (id, lbl) ->
                              Box(
                                  modifier = Modifier.weight(1f).clip(RoundedCornerShape(10.dp)).background(if (textColorMode == id) Color(0xFF38BDF8) else Color(0xFF1E293B))
                                      .clickable { textColorMode = id; prefs.edit().putString("text_color_mode", id).apply() }.padding(10.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(lbl, color = if (textColorMode == id) Color.Black else Color.White, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                              }
                          }
                      }
                      Text("Tamaño de iconos: ${iconSizeDp.roundToInt()} dp", color = Color.White)
                      Slider(value = iconSizeDp, onValueChange = { iconSizeDp = it; prefs.edit().putFloat("icon_size", it).apply() }, valueRange = 30f..60f)
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("Ocultar alfabeto en reposo", color = Color.White)
                          Switch(checked = hideAlphabet, onCheckedChange = { hideAlphabet = it; prefs.edit().putBoolean("hide_alphabet", it).apply() })
                      }
                      Button(onClick = { currentScreen = "HOME" }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF38BDF8)), modifier = Modifier.fillMaxWidth()) {
                          Text("Aplicar y volver al Inicio", color = Color.Black, fontWeight = FontWeight.Bold)
                      }
                  }
                  return
              }

              val favoriteApps = remember(apps, favoritePackages) { favoritePackages.mapNotNull { pkg -> apps.find { it.packageName == pkg } } }
              val displayedApps = remember(apps, favoriteApps, searchQuery, isSearching, activeChar) {
                  when {
                      isSearching && searchQuery.isNotBlank() -> apps.filter { it.label.contains(searchQuery.trim(), ignoreCase = true) }
                      isSearching -> apps
                      activeChar == '★' -> favoriteApps
                      else -> apps.filter { it.initial == activeChar }.ifEmpty { apps }
                  }
              }

              val w = containerSize.width.toFloat().coerceAtLeast(1f)
              val h = containerSize.height.toFloat().coerceAtLeast(1f)
              val topWaveY = h * 0.16f
              val bottomWaveY = h * 0.86f

              val wavePoints = remember(containerSize, touchY, waveOnLeft) {
                  val safeTotal = (LINCE_INDEX.size - 1).coerceAtLeast(1)
                  val maxShift = with(density) { 68.dp.toPx() }
                  val rad = with(density) { 120.dp.toPx() }
                  LINCE_INDEX.indices.map { i ->
                      val t = i.toFloat() / safeTotal.toFloat()
                      val baseY = topWaveY + t * (bottomWaveY - topWaveY)
                      val baseX = if (waveOnLeft) with(density) { 24.dp.toPx() } else w - with(density) { 24.dp.toPx() }
                      val shift = touchY?.let { ty ->
                          val d = abs(baseY - ty)
                          if (d < rad) ((1f + cos((d / rad) * PI.toFloat())) / 2f) * maxShift else 0f
                      } ?: 0f
                      Offset(if (waveOnLeft) baseX + shift else baseX - shift, baseY)
                  }
              }

              fun handleWaveTouch(yPos: Float) {
                  touchY = yPos
                  val clampedY = yPos.coerceIn(topWaveY, bottomWaveY)
                  val idx = (((clampedY - topWaveY) / (bottomWaveY - topWaveY).coerceAtLeast(1f)) * (LINCE_INDEX.size - 1)).roundToInt().coerceIn(0, LINCE_INDEX.size - 1)
                  if (activeWaveIndex != idx) {
                      activeWaveIndex = idx
                      activeChar = LINCE_INDEX[idx]
                      isSearching = false
                      searchQuery = ""
                      view.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                  }
              }

              Box(
                  modifier = Modifier.fillMaxSize().onSizeChanged { containerSize = it }
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onLongPress = { view.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS); showQuickSheet = true },
                              onTap = { if (isMovingWidgetMode) isMovingWidgetMode = false }
                          )
                      }
                      .pointerInput(Unit) {
                          var dy = 0f
                          detectVerticalDragGestures(
                              onDragStart = { dy = 0f },
                              onVerticalDrag = { _, d -> dy += d },
                              onDragEnd = {
                                  if (dy < -90f && !isSearching) isSearching = true
                                  else if (dy > 90f && !isSearching) expandStatusBar(context)
                              }
                          )
                      }
              ) {
                  // 1. FONDOS DE PANTALLA (LINCE CLAROS Y VIVOS + NIAGARA + EGIPTO + GALERÍA)
                  if (wallpaperStyle == "custom_gallery" && customWallpaperBitmap != null) {
                      Image(bitmap = customWallpaperBitmap!!.asImageBitmap(), contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                  } else {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          val cw = size.width
                          val ch = size.height
                          when (wallpaperStyle) {
                              "lince_sol_claro" -> drawBrightLinceWallpaper(this, cw, ch, style = 1)
                              "lince_marisma_clara" -> drawBrightLinceWallpaper(this, cw, ch, style = 2)
                              "lince_miel_dorada" -> drawBrightLinceWallpaper(this, cw, ch, style = 3)
                              "split_waves" -> drawNiagaraSplitWaves(this, cw, ch)
                              "dark_beach" -> drawNiagaraDarkBeach(this, cw, ch)
                              "purple_swirl" -> {
                                  drawRect(brush = Brush.verticalGradient(listOf(Color(0xFF8B5CF6), Color(0xFF6D28D9), Color(0xFF2E1065))))
                                  drawCircle(Color(0xFFDDD6FE).copy(alpha = 0.3f), radius = cw * 0.6f, center = Offset(cw * 0.65f, ch * 0.42f))
                              }
                              "emerald_mist" -> {
                                  drawRect(brush = Brush.verticalGradient(listOf(Color(0xFF34D399), Color(0xFF059669), Color(0xFF065F46))))
                                  drawCircle(Color(0xFFD1FAE5).copy(alpha = 0.3f), radius = cw * 0.55f, center = Offset(cw * 0.7f, ch * 0.35f))
                              }
                              "nilo_piramides" -> drawEgyptianNileWallpaper(this, cw, ch, false)
                              "noche_faraonica" -> drawEgyptianNileWallpaper(this, cw, ch, true)
                              else -> drawBrightLinceWallpaper(this, cw, ch, style = 1)
                          }

                          // LÍNEA GUÍA COLOREADA DE LA OLA ALFABÉTICA
                          if (wavePoints.size > 1 && (!hideAlphabet || touchY != null)) {
                              for (i in 1 until wavePoints.size) {
                                  val segColor = getWaveLetterColor(i, waveColorMode, accentColor)
                                  drawLine(
                                      color = segColor.copy(alpha = if (touchY != null) 0.85f else 0.45f),
                                      start = wavePoints[i - 1],
                                      end = wavePoints[i],
                                      strokeWidth = if (touchY != null) 4.5.dp.toPx() else 2.5.dp.toPx(),
                                      cap = StrokeCap.Round
                                  )
                              }
                          }
                      }
                  }

                  // 2. CONTENIDO CENTRAL (RELOJES + LISTA DE APPS)
                  Column(
                      modifier = Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding()
                          .padding(start = if (waveOnLeft) 62.dp else 24.dp, end = if (waveOnLeft) 24.dp else 58.dp, top = 10.dp, bottom = 10.dp)
                  ) {
                      if (isMovingWidgetMode) {
                          Row(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(14.dp)).background(Color(0xEE18191C)).padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                              Slider(value = verticalOffsetDp, onValueChange = { verticalOffsetDp = it; prefs.edit().putFloat("vertical_offset", it).apply() }, valueRange = 0f..180f, modifier = Modifier.weight(1f))
                              TextButton(onClick = { isMovingWidgetMode = false }) { Text("Hecho", color = Color(0xFF38BDF8)) }
                          }
                      }

                      Spacer(modifier = Modifier.height(verticalOffsetDp.dp))

                      if (!isSearching && activeChar == '★') {
                          Box(
                              modifier = Modifier.fillMaxWidth().padding(bottom = 14.dp)
                                  .pointerInput(Unit) { detectTapGestures(onTap = { showClockPicker = true }, onLongPress = { showQuickSheet = true }) },
                              contentAlignment = Alignment.CenterStart
                          ) {
                              when (clockType) {
                                  1 -> {
                                      // RELOJ OREJAS DE LINCE CLARO Y SOLEADO (ESFERA CREMA/SOLAR SIN NEGRO)
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Canvas(modifier = Modifier.size(124.dp)) {
                                              val center = Offset(size.width / 2f, size.height / 2f)
                                              val r = size.width / 2f
                                              // Esfera crema marfil luminosa con borde ámbar dorado
                                              drawCircle(Color(0xEEFFFBEB), radius = r)
                                              drawCircle(Color(0xFFD97706), radius = r, style = Stroke(width = 3.dp.toPx()))
                                              // Silueta de orejas de lince con pinceles en la parte superior
                                              val ears = Path().apply {
                                                  moveTo(center.x - 28f, center.y - 12f); lineTo(center.x - 46f, center.y - r * 0.82f); lineTo(center.x - 10f, center.y - 20f)
                                                  moveTo(center.x + 28f, center.y - 12f); lineTo(center.x + 46f, center.y - r * 0.82f); lineTo(center.x + 10f, center.y - 20f)
                                              }
                                              drawPath(ears, Color(0xFFF59E0B).copy(alpha = 0.55f), style = Stroke(width = 2.5.dp.toPx()))
                                              val hAng = ((hourFloat % 12f) * 30f - 90f) * (PI.toFloat() / 180f)
                                              val mAng = (minuteFloat * 6f - 90f) * (PI.toFloat() / 180f)
                                              drawLine(Color(0xFFB45309), center, Offset(center.x + cos(hAng) * (r * 0.50f), center.y + sin(hAng) * (r * 0.50f)), strokeWidth = 4.dp.toPx(), cap = StrokeCap.Round)
                                              drawLine(Color(0xFF111827), center, Offset(center.x + cos(mAng) * (r * 0.72f), center.y + sin(mAng) * (r * 0.72f)), strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round)
                                              drawCircle(Color(0xFFD97706), radius = 4.5.dp.toPx(), center = center)
                                          }
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Box(modifier = Modifier.clip(RoundedCornerShape(16.dp)).background(Color(0xDDFFFBEB)).border(1.dp, Color(0xFFD97706), RoundedCornerShape(16.dp)).padding(horizontal = 12.dp, vertical = 4.dp)) {
                                              Text("🐾 LINCE IBÉRICO • $currentTime • 🔋 $batteryLevel%", color = Color(0xFF78350F), fontSize = 11.sp, fontWeight = FontWeight.ExtraBold)
                                          }
                                      }
                                  }
                                  2 -> {
                                      // RELOJ BRISA DE DOÑANA CLARO
                                      Box(modifier = Modifier.clip(RoundedCornerShape(22.dp)).background(Color(0xEEFFFBEB)).border(2.dp, Color(0xFF10B981), RoundedCornerShape(22.dp)).padding(horizontal = 20.dp, vertical = 12.dp)) {
                                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                              Text("🐾 PARQUE DE DOÑANA", color = Color(0xFF047857), fontSize = 10.sp, fontWeight = FontWeight.ExtraBold, letterSpacing = 1.5.sp)
                                              Text(currentTime, color = Color(0xFF064E3B), fontSize = 38.sp, fontWeight = FontWeight.ExtraBold)
                                              Text("$currentDateShort  •  ☀ 22°C  •  🔋 $batteryLevel%", color = Color(0xFF059669), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                                  3 -> {
                                      // NIAGARA KWGT: SEMANA 05 + BARRA DE SEMANA (MÓVIL IZQUIERDO INTRO VÍDEO)
                                      Column(modifier = Modifier.width(180.dp)) {
                                          Text("${currentWeekNumber}TH WEEK OF 2026", color = primaryTextColor.copy(alpha = 0.75f), fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.5.sp)
                                          Spacer(modifier = Modifier.height(5.dp))
                                          Box(modifier = Modifier.fillMaxWidth(0.75f).height(6.dp).clip(CircleShape).background(primaryTextColor.copy(alpha = 0.2f))) {
                                              Box(modifier = Modifier.fillMaxWidth(0.6f).height(6.dp).clip(CircleShape).background(Color(0xFF0284C7)))
                                          }
                                          Text(currentDayName.lowercase(), color = primaryTextColor, fontSize = 26.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Serif)
                                          Text("$currentTime  •  ☀ 21°C  •  🔋 $batteryLevel%", color = primaryTextColor.copy(alpha = 0.85f), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                                  4 -> {
                                      // RELOJ SOLAR EGIPCIO DE RA
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text("☥  SOL DE RA • VALLE DEL NILO  ☥", color = Color(0xFFFFD700), fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Canvas(modifier = Modifier.size(128.dp)) {
                                              val center = Offset(size.width / 2f, size.height / 2f)
