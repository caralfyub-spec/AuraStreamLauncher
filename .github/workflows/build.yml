
name: Compilar Pixel Ultra Launcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar APK Directo
        run: |
          mkdir -p app/build/outputs/apk/debug/
          javac -version
          echo "Empaquetando recursos de Aura Stream..."
          # Creacion directa de la estructura del APK
          cd app/src/main/
          zip -r ../../../app-debug-unsigned.zip java AndroidManifest.xml
          cd ../../..
          mv app-debug-unsigned.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Ultra-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
