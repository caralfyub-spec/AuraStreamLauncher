### Cómo funciona el nuevo sistema simple de importación (v8.0):
1. **🪄 Importar Tema desde cualquier Imagen o Captura (Auto-Creador en 1 Toque):**
   * Pulsas el nuevo botón **`📥 Importar Tema`**, eliges cualquier fondo o captura de pantalla descargada de otra app (*Zedge, Backdrops, Pinterest, Walli, etc.*) y el launcher **extrae automáticamente los colores dominantes**, ajusta el color de los iconos, el reloj y el texto a juego, y **lo guarda permanentemente en tu lista «Mis Temas Incorporados»** para que puedas activarlo siempre que quieras con un toque.
2. **📱 Usar Tema / Fondo en Vivo de otra App (KLWP, Zedge, Google Fondos):**
   * Incluye el modo **Sincronización con Fondo del Sistema**. Si aplicas un tema animado o fondo desde otra aplicación externa en tu Pixel, el launcher se vuelve transparente automáticamente y adapta sus colores al tema externo.
3. **📦 Detector automático de Paquetes de Iconos y Apps de Temas:**
   * Escanea tu móvil para detectar paquetes de iconos instalados (*Nova, Lawnchair, ADW, Icon Pack Studio*) y te permite aplicar sus iconos directamente sobre tus aplicaciones o abrir la app externa para importar nuevos diseños.

