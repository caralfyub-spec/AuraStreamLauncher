                                  TextButton(onClick = { isMovingWidgetMode = false }) {
                                      Text("Hecho", color = accentColor, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Slider(
                                  value = verticalOffsetDp,
                                  onValueChange = {
                                      verticalOffsetDp = it
                                      prefs.edit().putFloat("vertical_offset", it).apply()
                                  },
                                  valueRange = 0f..140f,
                                  colors = SliderDefaults.colors(thumbColor = accentColor, activeTrackColor = accentColor)
                              )
                          }
                          Spacer(modifier = Modifier.height(8.dp))
                      }

                      Spacer(modifier = Modifier.height(verticalOffsetDp.dp))

                      if (clockStyle > 0 || showCalendarDate || showWeather || showBattery) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clickable { showNiagaraWidgetSheet = true }
                                  .padding(bottom = 12.dp)
                          ) {
                              if (clockStyle > 0) {
                                  Text(
                                      text = currentTime,
                                      color = primaryTextColor,
                                      fontSize = if (clockStyle == 2) 60.sp else 48.sp,
                                      fontWeight = if (clockStyle == 2) FontWeight.Bold else FontWeight.Light,
                                      fontFamily = appFontFamily,
                                      letterSpacing = (-1.5).sp
                                  )
                              }
                              if (showCalendarDate || showWeather || showBattery) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      if (showCalendarDate) {
                                          Text(
                                              text = currentDateShort,
                                              color = primaryTextColor.copy(alpha = 0.85f),
                                              fontSize = 14.sp,
                                              fontFamily = appFontFamily,
                                              fontWeight = FontWeight.Medium
                                          )
                                      }
                                      if (showWeather) {
                                          Text(
                                              text = if (showCalendarDate) "  •  ☀ 17°C" else "☀ 17°C",
                                              color = primaryTextColor.copy(alpha = 0.85f),
                                              fontSize = 14.sp
                                          )
                                      }
                                      if (showBattery) {
                                          Text(
                                              text = "  •  $batteryLevel%",
                                              color = secondaryTextColor,
                                              fontSize = 14.sp
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      if (!isSearching && activeChar == '★' && kwgtStyle > 0) {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(bottom = 18.dp)
                                  .pointerInput(Unit) {
                                      detectTapGestures(
                                          onTap = { showKwgtPicker = true },
                                          onLongPress = { showNiagaraWidgetSheet = true }
                                      )
                                  },
                              contentAlignment = Alignment.CenterStart
                          ) {
                              when (kwgtStyle) {
                                  1 -> {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text(
                                              text = "SEMANA $currentWeekNumber DE 2026",
                                              color = Color(0xFFD4AF37).copy(alpha = 0.8f),
                                              fontSize = 8.sp,
                                              letterSpacing = 2.sp
                                          )
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Box(
                                              modifier = Modifier
                                                  .border(1.dp, Color(0xFFD4AF37), RoundedCornerShape(4.dp))
                                                  .padding(horizontal = 22.dp, vertical = 10.dp)
                                          ) {
                                              Text(
                                                  text = currentDayName.toCharArray().joinToString(" "),
                                                  color = primaryTextColor,
                                                  fontSize = 16.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  letterSpacing = 3.sp
                                              )
                                          }
                                          Spacer(modifier = Modifier.height(4.dp))
                                          Text(
                                              text = currentTime,
                                              color = primaryTextColor.copy(alpha = 0.7f),
                                              fontSize = 10.sp
                                          )
                                      }
                                  }
                                  2 -> {
                                      Column(
                                          horizontalAlignment = Alignment.CenterHorizontally,
                                          modifier = Modifier.padding(start = 8.dp)
                                      ) {
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(12.dp))
                                                  .background(Color.White)
                                                  .padding(horizontal = 16.dp, vertical = 4.dp)
                                          ) {
                                              Text(
                                                  text = currentDayName,
                                                  color = Color.Black,
                                                  fontSize = 9.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  letterSpacing = 1.sp
                                              )
                                          }
                                          Spacer(modifier = Modifier.height(10.dp))
                                          Canvas(modifier = Modifier.size(116.dp)) {
                                              drawCircle(color = Color.White)
                                              val center = Offset(size.width / 2f, size.height / 2f)
                                              val r = size.width / 2f
                                              for (m in 0 until 12) {
                                                  val ang = (m * 30.0 - 90.0) * (PI / 180.0)
                                                  val p1 = Offset(
                                                      (center.x + cos(ang) * (r * 0.80f)).toFloat(),
                                                      (center.y + sin(ang) * (r * 0.80f)).toFloat()
                                                  )
                                                  val p2 = Offset(
                                                      (center.x + cos(ang) * (r * 0.90f)).toFloat(),
                                                      (center.y + sin(ang) * (r * 0.90f)).toFloat()
                                                  )
                                                  drawLine(Color.Black.copy(alpha = 0.45f), p1, p2, strokeWidth = 2.dp.toPx())
                                              }
                                              val hAngle = ((hourFloat % 12f) * 30f - 90f) * (PI.toFloat() / 180f)
                                              val mAngle = (minuteFloat * 6f - 90f) * (PI.toFloat() / 180f)
                                              drawLine(
                                                  color = Color.Black,
                                                  start = center,
                                                  end = Offset(
                                                      center.x + cos(hAngle) * (r * 0.48f),
                                                      center.y + sin(hAngle) * (r * 0.48f)
                                                  ),
                                                  strokeWidth = 3.5.dp.toPx(),
                                                  cap = StrokeCap.Round
                                              )
                                              drawLine(
                                                  color = Color.Black,
                                                  start = center,
                                                  end = Offset(
                                                      center.x + cos(mAngle) * (r * 0.70f),
                                                      center.y + sin(mAngle) * (r * 0.70f)
                                                  ),
                                                  strokeWidth = 2.5.dp.toPx(),
                                                  cap = StrokeCap.Round
                                              )
                                              drawCircle(Color.Black, radius = 3.5.dp.toPx(), center = center)
                                          }
                                          Spacer(modifier = Modifier.height(8.dp))
                                          Text(
                                              text = "$currentDateShort  •  $currentTime",
                                              color = primaryTextColor.copy(alpha = 0.85f),
                                              fontSize = 11.sp
                                          )
                                      }
                                  }
                                  3 -> {
                                      Column(modifier = Modifier.width(175.dp)) {
                                          Text(
                                              text = "${currentWeekNumber}TH WEEK OF 2026",
                                              color = primaryTextColor.copy(alpha = 0.7f),
                                              fontSize = 8.sp,
                                              fontWeight = FontWeight.Bold,
                                              letterSpacing = 1.5.sp
                                          )
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Box(
                                              modifier = Modifier
                                                  .fillMaxWidth(0.75f)
                                                  .height(6.dp)
                                                  .clip(CircleShape)
                                                  .background(primaryTextColor.copy(alpha = 0.15f))
                                          ) {
                                              Box(
                                                  modifier = Modifier
                                                      .fillMaxWidth(0.55f)
                                                      .height(6.dp)
                                                      .clip(CircleShape)
                                                      .background(primaryTextColor.copy(alpha = 0.65f))
                                              )
                                          }
                                          Spacer(modifier = Modifier.height(4.dp))
                                          Box(contentAlignment = Alignment.CenterStart) {
                                              Text(
                                                  text = currentDayNumber,
                                                  color = primaryTextColor.copy(alpha = 0.12f),
                                                  fontSize = 54.sp,
                                                  fontWeight = FontWeight.ExtraBold
                                              )
                                              Text(
                                                  text = currentDayName.lowercase(),
                                                  color = primaryTextColor,
                                                  fontSize = 24.sp,
                                                  fontWeight = FontWeight.Medium,
                                                  fontFamily = FontFamily.Serif
                                              )
                                          }
                                          Text(
                                              text = currentTime,
                                              color = primaryTextColor,
                                              fontSize = 16.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Spacer(modifier = Modifier.height(4.dp))
                                          Text(
                                              text = "¡Hola de nuevo! El tiempo hoy es muy soleado. Temperatura 17°C. Batería $batteryLevel%.",
                                              color = secondaryTextColor,
                                              fontSize = 9.sp,
                                              lineHeight = 12.sp
                                          )
                                      }
                                  }
                                  4 -> {
                                      Column(modifier = Modifier.width(170.dp)) {
                                          Text(
                                              text = currentDayNumber,
                                              color = primaryTextColor.copy(alpha = 0.75f),
                                              fontSize = 54.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Text(
                                              text = "El tiempo hoy es soleado • 17°C\nBatería al $batteryLevel% • $currentTime",
                                              color = secondaryTextColor,
                                              fontSize = 9.sp,
                                              lineHeight = 12.sp
                                          )
                                          Spacer(modifier = Modifier.height(10.dp))
                                          Row(
                                              verticalAlignment = Alignment.CenterVertically,
                                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                                          ) {
                                              Row(
                                                  modifier = Modifier
                                                      .weight(1f)
                                                      .height(24.dp)
                                                      .clip(CircleShape)
                                                      .background(Color(0xFF111827))
                                                      .clickable { isSearching = true }
                                                      .padding(horizontal = 8.dp),
                                                  verticalAlignment = Alignment.CenterVertically
                                              ) {
                                                  Icon(
                                                      imageVector = Icons.Default.Search,
                                                      contentDescription = null,
                                                      tint = Color.White,
                                                      modifier = Modifier.size(12.dp)
                                                  )
                                              }
                                              Box(
                                                  modifier = Modifier
                                                      .size(18.dp)
                                                      .clip(CircleShape)
                                                      .background(Color(0xFF0284C7))
                                              )
                                              Box(
                                                  modifier = Modifier
                                                      .size(14.dp)
                                                      .clip(CircleShape)
                                                      .background(Color(0xFF38BDF8))
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      if (isSearching) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(28.dp))
                                  .background(Color(0xEEFFFFFF))
                                  .padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(
                                  imageVector = Icons.Default.Search,
                                  contentDescription = null,
                                  tint = Color(0xFF111827),
                                  modifier = Modifier.size(20.dp)
                              )
                              Spacer(modifier = Modifier.width(10.dp))
                              BasicTextField(
                                  value = searchQuery,
                                  onValueChange = { searchQuery = it },
                                  singleLine = true,
                                  textStyle = TextStyle(color = Color(0xFF111827), fontSize = 16.sp),
                                  cursorBrush = SolidColor(Color(0xFF0284C7)),
                                  modifier = Modifier.weight(1f),
                                  decorationBox = { innerTextField ->
                                      if (searchQuery.isEmpty()) {
                                          Text(
                                              text = "Buscar aplicaciones...",
                                              color = Color(0xFF6B7280),
                                              fontSize = 15.sp
                                          )
                                      }
                                      innerTextField()
                                  }
                              )
                              IconButton(
                                  onClick = {
                                      searchQuery = ""
                                      isSearching = false
                                  },
                                  modifier = Modifier.size(22.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.Close,
                                      contentDescription = null,
                                      tint = Color(0xFF374151)
                                  )
                              }
                          }
                          Spacer(modifier = Modifier.height(12.dp))
                      }

                      // CABECERA DE LA LETRA ACTIVA CUANDO SE FIJA EN PANTALLA
                      if (!isSearching && activeChar != '★') {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier
                                  .padding(bottom = 8.dp)
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(primaryTextColor.copy(alpha = 0.1f))
                                  .padding(horizontal = 12.dp, vertical = 6.dp)
                          ) {
                              Text(
                                  text = "Sección: $activeChar",
                                  color = primaryTextColor,
                                  fontSize = 16.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Spacer(modifier = Modifier.width(12.dp))
                              TextButton(
                                  onClick = {
                                      activeChar = '★'
                                      activeWaveIndex = null
                                  },
                                  contentPadding = PaddingValues(0.dp)
                              ) {
                                  Text("✕ Volver a favoritos", color = accentColor, fontSize = 13.sp)
                              }
                          }
                      }

                      LazyColumn(
                          state = listState,
                          modifier = Modifier.fillMaxSize(),
                          verticalArrangement = Arrangement.spacedBy(2.dp),
                          contentPadding = PaddingValues(bottom = 90.dp)
                      ) {
                          items(displayedApps.size) { i ->
                              val app = displayedApps[i]
                              val arcOffsetDp = if (touchY != null) {
                                  val normalized = (i - displayedApps.size / 2f) / (displayedApps.size.coerceAtLeast(1) / 2f)
                                  val curve = (1f - (normalized * normalized).coerceIn(0f, 1f)) * 34f
                                  if (waveOnLeft) curve else -curve
                              } else {
                                  0f
                              }

                              NiagaraVideoAppRow(
                                  app = app,
                                  textColor = primaryTextColor,
                                  fontFamily = appFontFamily,
                                  iconPackMode = iconPackMode,
                                  iconSizeDp = iconSizeDp,
                                  hideName = hideFavoriteNames && activeChar == '★' && !isSearching,
                                  horizontalShiftDp = arcOffsetDp,
                                  onClick = { launchApp(context, app.packageName) },
                                  onLongClick = { selectedAppForMenu = app }
                              )
                          }

                          item(key = "niagara_footer_controls") {
                              Spacer(modifier = Modifier.height(18.dp))
                              Row(
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(primaryTextColor.copy(alpha = 0.12f))
                                          .clickable { currentScreen = "FAVORITES" }
                                          .padding(horizontal = 12.dp, vertical = 8.dp)
                                  ) {
                                      Text(
                                          text = "★ Editar favoritos",
                                          color = primaryTextColor.copy(alpha = 0.85f),
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Medium
                                      )
                                  }
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(primaryTextColor.copy(alpha = 0.12f))
                                          .clickable { currentScreen = "SETTINGS" }
                                          .padding(horizontal = 12.dp, vertical = 8.dp)
                                  ) {
                                      Text(
                                          text = "⚙ Configuración de Niagara",
                                          color = primaryTextColor.copy(alpha = 0.85f),
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Medium
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // OLA ALFABÉTICA (AL LEVANTAR EL DEDO, LA LETRA SE QUEDA FIJA Y LA LISTA MANTIENE EL FILTRO)
                  Box(
                      modifier = Modifier
                          .fillMaxHeight()
                          .width(72.dp)
                          .align(if (waveOnLeft) Alignment.CenterStart else Alignment.CenterEnd)
                          .pointerInput(containerSize, waveOnLeft) {
                              detectTapGestures(
                                  onPress = { offset ->
                                      handleWaveTouch(offset.y)
                                      tryAwaitRelease()
                                      touchY = null
                                      activeWaveIndex = null
                                      // YA NO SE RESTABLECE ACTIVECHAR AL SOLTAR, SE QUEDA FIJA
                                  }
                              )
                          }
                          .pointerInput(containerSize, waveOnLeft) {
                              detectDragGestures(
                                  onDragStart = { offset -> handleWaveTouch(offset.y) },
                                  onDrag = { change, _ ->
                                      change.consume()
                                      handleWaveTouch(change.position.y)
                                  },
                                  onDragEnd = {
                                      touchY = null
                                      activeWaveIndex = null
                                      // AL LEVANTAR EL DEDO, SE MANTIENE FIJA EN LA LETRA SELECCIONADA
                                  },
                                  onDragCancel = {
                                      touchY = null
                                      activeWaveIndex = null
                                  }
                              )
                          }
                  ) {}

                  wavePoints.forEachIndexed { index, pt ->
                      val char = NIAGARA_INDEX[index]
                      val isSelected = activeWaveIndex == index
                      val isCurrentSection = activeChar == char && activeWaveIndex == null
                      val dist = activeWaveIndex?.let { abs(index - it) } ?: 99

                      val alphaVal = when {
                          touchY != null -> when {
                              dist == 0 -> 1f
                              dist <= 3 -> 0.9f
                              else -> 0.5f
                          }
                          hideAlphabet -> 0f
                          isCurrentSection -> 1f
                          else -> 0.78f
                      }

                      if (alphaVal > 0.01f) {
                          val boxPx = with(density) { 24.dp.toPx() }
                          Box(
                              modifier = Modifier
                                  .offset {
                                      IntOffset(
                                          x = (pt.x - boxPx / 2f).roundToInt(),
                                          y = (pt.y - boxPx / 2f).roundToInt()
                                      )
                                  }
                                  .size(24.dp)
                                  .scale(if (isSelected || isCurrentSection) 1.5f else 1f)
                                  .alpha(alphaVal),
                              contentAlignment = Alignment.Center
                          ) {
                              Text(
                                  text = char.toString(),
                                  color = if (isSelected || isCurrentSection || (wallpaperStyle == "split_waves" && touchY == null)) Color.White else primaryTextColor,
                                  fontSize = 11.sp,
                                  fontWeight = if (isSelected || isCurrentSection) FontWeight.Bold else FontWeight.Medium
                              )
                          }
                      }
                  }

                  val currentIdx = activeWaveIndex
                  val currentTouchY = touchY
                  if (currentIdx != null && currentTouchY != null) {
                      val bubbleSizePx = with(density) { 56.dp.toPx() }
                      val bubbleX = if (waveOnLeft) {
                          with(density) { 96.dp.toPx() }
                      } else {
                          w - with(density) { 96.dp.toPx() } - bubbleSizePx
                      }
                      val bubbleY = (currentTouchY - bubbleSizePx / 2f)
                          .coerceIn(topWaveY - 20f, bottomWaveY - bubbleSizePx + 20f)

                      Box(
                          modifier = Modifier
                              .offset {
                                  IntOffset(
                                      x = bubbleX.roundToInt(),
                                      y = bubbleY.roundToInt()
                                  )
                              }
                              .size(56.dp)
                              .background(Color(0xFF4F46E5), CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              text = NIAGARA_INDEX[currentIdx].toString(),
                              color = Color.White,
                              fontSize = 24.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }

                  if (showNiagaraButton) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomEnd)
                              .navigationBarsPadding()
                              .padding(end = 22.dp, bottom = 18.dp)
                              .size(46.dp)
                              .clip(CircleShape)
                              .background(Color.White.copy(alpha = 0.24f))
                              .border(1.dp, Color.White.copy(alpha = 0.45f), CircleShape)
                              .pointerInput(Unit) {
                                  detectTapGestures(
                                      onTap = { currentScreen = "SETTINGS" },
                                      onLongPress = { showNiagaraWidgetSheet = true }
                                  )
                              },
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              imageVector = Icons.Default.Settings,
                              contentDescription = "Configuración de Niagara",
                              tint = Color.White,
                              modifier = Modifier.size(22.dp)
                          )
                      }
