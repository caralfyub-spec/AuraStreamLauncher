

name: Compilar APK Real

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Crear estructura de proyecto y compilar con Gradle
        run: |
          mkdir -p app/src/main/java/com/atenea/pixelultralauncher
          
          # Buscar y colocar MainActivity.kt y AndroidManifest.xml en su ruta
          find . -maxdepth 3 -name "MainActivity.kt" -exec cp {} app/src/main/java/com/atenea/pixelultralauncher/MainActivity.kt \;
          find . -maxdepth 3 -name "AndroidManifest.xml" -exec cp {} app/src/main/AndroidManifest.xml \;

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AuraStream"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.atenea.pixelultralauncher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.atenea.pixelultralauncher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug

      - name: Subir APK listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Stream-APK-Instalable
          path: app/build/outputs/apk/debug/app-debug.apk
