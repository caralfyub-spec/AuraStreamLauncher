          // =========================================================================
          // FONDOS SUPER CLAROS Y LUMINOSOS DEL LINCE IBÉRICO (DÍA SOLEADO, DOÑANA Y MIEL)
          // =========================================================================
          fun drawBrightLinceWallpaper(drawScope: DrawScope, cw: Float, ch: Float, style: Int) {
              with(drawScope) {
                  val skyColors = when (style) {
                      2 -> listOf(Color(0xFFECFDF5), Color(0xFFA7F3D0), Color(0xFF6EE7B7)) // Brisa Clara de Doñana
                      3 -> listOf(Color(0xFFFDE68A), Color(0xFFF59E0B), Color(0xFFEA580C)) // Tarde Dorada Miel
                      else -> listOf(Color(0xFFE0F2FE), Color(0xFF7DD3FC), Color(0xFFFEF08A)) // Mañana Soleada Sierra Morena
                  }
                  drawRect(brush = Brush.verticalGradient(skyColors, startY = 0f, endY = ch * 0.72f))

                  // Sol brillante de día
                  val sunPos = Offset(cw * 0.74f, ch * 0.20f)
                  drawCircle(Color.White.copy(alpha = 0.65f), radius = cw * 0.36f, center = sunPos)
                  drawCircle(Color(0xFFFFFBEB), radius = cw * 0.14f, center = sunPos)

                  // Montañas y colinas verdes/doradas claras
                  val hill1 = Path().apply {
                      moveTo(0f, ch * 0.58f)
                      quadraticBezierTo(cw * 0.35f, ch * 0.49f, cw * 0.75f, ch * 0.59f)
                      quadraticBezierTo(cw * 0.9f, ch * 0.63f, cw, ch * 0.56f)
                      lineTo(cw, ch); lineTo(0f, ch); close()
                  }
                  drawPath(hill1, if (style == 2) Color(0xFF34D399) else if (style == 3) Color(0xFFD97706) else Color(0xFF4ADE80))

                  val hill2 = Path().apply {
                      moveTo(0f, ch * 0.70f)
                      quadraticBezierTo(cw * 0.45f, ch * 0.63f, cw, ch * 0.73f)
                      lineTo(cw, ch); lineTo(0f, ch); close()
                  }
                  drawPath(hill2, if (style == 2) Color(0xFFFEF3C7) else if (style == 3) Color(0xFFB45309) else Color(0xFF22C55E))

                  // ILUSTRACIÓN DETALLADA Y LUMINOSA DEL LINCE IBÉRICO A LA DERECHA
                  val ox = cw * 0.46f
                  val oy = ch * 0.44f
                  val sz = cw * 0.50f

                  // 1. Cuerpo y cabeza en dorado ocre claro y luminoso
                  val body = Path().apply {
                      moveTo(ox + sz * 0.05f, oy + sz * 1.05f)
                      quadraticBezierTo(ox + sz * 0.14f, oy + sz * 0.46f, ox + sz * 0.32f, oy + sz * 0.34f)
                      lineTo(ox + sz * 0.36f, oy + sz * 0.10f)
                      lineTo(ox + sz * 0.45f, oy + sz * 0.22f)
                      lineTo(ox + sz * 0.55f, oy + sz * 0.06f)
                      lineTo(ox + sz * 0.62f, oy + sz * 0.22f)
                      lineTo(ox + sz * 0.78f, oy + sz * 0.33f)
                      lineTo(ox + sz * 0.66f, oy + sz * 0.44f)
                      lineTo(ox + sz * 0.58f, oy + sz * 0.60f)
                      lineTo(ox + sz * 0.54f, oy + sz * 1.05f)
                      close()
                  }
                  drawPath(body, Color(0xFFF59E0B))
                  drawPath(body, Color(0xFFFFFBEB), style = Stroke(width = 4f))

                  // 2. Interior rosado/crema de las orejas
                  val innerEar1 = Path().apply {
                      moveTo(ox + sz * 0.35f, oy + sz * 0.24f)
                      lineTo(ox + sz * 0.36f, oy + sz * 0.13f)
                      lineTo(ox + sz * 0.42f, oy + sz * 0.22f)
                      close()
                  }
                  val innerEar2 = Path().apply {
                      moveTo(ox + sz * 0.50f, oy + sz * 0.21f)
                      lineTo(ox + sz * 0.55f, oy + sz * 0.10f)
                      lineTo(ox + sz * 0.60f, oy + sz * 0.21f)
                      close()
                  }
                  drawPath(innerEar1, Color(0xFFFDE68A))
                  drawPath(innerEar2, Color(0xFFFDE68A))

                  // 3. Pecho y Patillas (Barba blanca característica del Lince Ibérico)
                  val whiteFur = Path().apply {
                      moveTo(ox + sz * 0.46f, oy + sz * 0.33f)
                      lineTo(ox + sz * 0.68f, oy + sz * 0.39f)
                      lineTo(ox + sz * 0.58f, oy + sz * 0.62f)
                      lineTo(ox + sz * 0.48f, oy + sz * 0.95f)
                      lineTo(ox + sz * 0.34f, oy + sz * 0.95f)
                      lineTo(ox + sz * 0.38f, oy + sz * 0.48f)
                      close()
                  }
                  drawPath(whiteFur, Color(0xFFFFFBEB))

                  // 4. Pinceles negros largos en las orejas y punta de las patillas
                  drawLine(Color(0xFF111827), Offset(ox + sz * 0.36f, oy + sz * 0.10f), Offset(ox + sz * 0.33f, oy - sz * 0.08f), strokeWidth = 7.5f, cap = StrokeCap.Round)
                  drawLine(Color(0xFF111827), Offset(ox + sz * 0.55f, oy + sz * 0.06f), Offset(ox + sz * 0.54f, oy - sz * 0.12f), strokeWidth = 7.5f, cap = StrokeCap.Round)

                  // 5. Ojo grande color miel/ámbar con chispa blanca de vida y nariz rosada/negra
                  val eyeCenter = Offset(ox + sz * 0.58f, oy + sz * 0.28f)
                  drawCircle(Color(0xFF111827), radius = 12f, center = eyeCenter)
                  drawCircle(Color(0xFFFDE047), radius = 9f, center = eyeCenter)
                  drawCircle(Color(0xFF111827), radius = 4.5f, center = eyeCenter)
                  drawCircle(Color.White, radius = 2.5f, center = eyeCenter + Offset(-2.5f, -2.5f))

                  // Nariz y bigotes blancos
                  val noseCenter = Offset(ox + sz * 0.75f, oy + sz * 0.33f)
                  drawCircle(Color(0xFFF43F5E), radius = 7f, center = noseCenter)
                  drawLine(Color.White, Offset(ox + sz * 0.62f, oy + sz * 0.38f), Offset(ox + sz * 0.84f, oy + sz * 0.42f), strokeWidth = 2.5f)
                  drawLine(Color.White, Offset(ox + sz * 0.60f, oy + sz * 0.41f), Offset(ox + sz * 0.82f, oy + sz * 0.47f), strokeWidth = 2.5f)

                  // 6. Motas oscuras sobre el manto dorado
                  val spots = listOf(
                      Offset(0.20f, 0.55f), Offset(0.27f, 0.48f), Offset(0.33f, 0.58f),
                      Offset(0.16f, 0.68f), Offset(0.26f, 0.70f), Offset(0.22f, 0.82f),
                      Offset(0.15f, 0.85f), Offset(0.28f, 0.88f)
                  )
                  spots.forEach { s ->
                      drawCircle(Color(0xFF451A03), radius = 7f, center = Offset(ox + sz * s.x, oy + sz * s.y))
                  }
              }
          }

          fun drawNiagaraSplitWaves(drawScope: DrawScope, cw: Float, ch: Float) {
              with(drawScope) {
                  val splitX = cw * 0.53f
                  drawRect(color = Color(0xFFF5F5F4))
                  drawRect(color = Color(0xFF1D5B96), topLeft = Offset(splitX, 0f), size = Size(cw - splitX, ch))
                  val centers = listOf(
                      Offset(cw * 0.65f, ch * 0.12f), Offset(cw * 0.88f, ch * 0.26f),
                      Offset(cw * 0.62f, ch * 0.44f), Offset(cw * 0.90f, ch * 0.60f),
                      Offset(cw * 0.66f, ch * 0.76f), Offset(cw * 0.86f, ch * 0.90f)
                  )
                  centers.forEach { c ->
                      for (r in 5 downTo 1) {
                          val rad = r * (cw * 0.065f)
                          drawCircle(if (r % 2 == 0) Color(0xFF0F3C69) else Color(0xFF3882C4), radius = rad, center = c)
                          drawCircle(Color(0xFFF5F5F4).copy(alpha = 0.85f), radius = rad, center = c, style = Stroke(width = 2.5.dp.toPx()))
                      }
                  }
                  drawRect(color = Color(0xFFF5F5F4), topLeft = Offset(0f, 0f), size = Size(splitX, ch))
              }
          }

          fun drawNiagaraDarkBeach(drawScope: DrawScope, cw: Float, ch: Float) {
              with(drawScope) {
                  drawRect(color = Color(0xFF07090D))
                  val foam = Path().apply {
                      moveTo(cw * 0.68f, 0f)
                      var y = 0f
                      while (y <= ch) {
                          lineTo(cw * 0.68f + sin(y * 0.012f) * (cw * 0.045f), y)
                          y += 20f
                      }
                      lineTo(cw, ch); lineTo(cw, 0f); close()
                  }
                  drawPath(foam, Brush.horizontalGradient(listOf(Color(0xFF334155), Color(0xFF1E293B)), startX = cw * 0.64f, endX = cw))
              }
          }

          fun drawEgyptianNileWallpaper(drawScope: DrawScope, cw: Float, ch: Float, isNight: Boolean) {
              with(drawScope) {
                  val sky = if (isNight) listOf(Color(0xFF060B19), Color(0xFF0F1E3D), Color(0xFF1E3A5F)) else listOf(Color(0xFF0284C7), Color(0xFFF59E0B), Color(0xFFFEF08A))
                  drawRect(brush = Brush.verticalGradient(sky, startY = 0f, endY = ch * 0.62f))
                  val sunCenter = Offset(cw * 0.68f, ch * 0.32f)
                  drawCircle(Color(0xFFFEF08A).copy(alpha = 0.5f), radius = cw * 0.32f, center = sunCenter)
                  drawCircle(Color(0xFFFFFBEB), radius = cw * 0.12f, center = sunCenter)

                  val horizonY = ch * 0.58f
                  fun pyramid(px: Float, py: Float, lx: Float, cx: Float, rx: Float) {
                      val lit = Path().apply { moveTo(px, py); lineTo(lx, horizonY); lineTo(cx, horizonY); close() }
                      val dark = Path().apply { moveTo(px, py); lineTo(cx, horizonY); lineTo(rx, horizonY); close() }
                      drawPath(lit, if (isNight) Color(0xFF334155) else Color(0xFFFBBF24))
                      drawPath(dark, if (isNight) Color(0xFF0F172A) else Color(0xFFB45309))
                      val capY = py + (horizonY - py) * 0.18f
                      val cap = Path().apply { moveTo(px, py); lineTo(px + (lx - px) * 0.18f, capY); lineTo(px + (rx - px) * 0.18f, capY); close() }
                      drawPath(cap, Color(0xFFFFD700))
                  }
                  pyramid(cw * 0.25f, ch * 0.46f, cw * 0.08f, cw * 0.23f, cw * 0.38f)
                  pyramid(cw * 0.56f, ch * 0.36f, cw * 0.28f, cw * 0.53f, cw * 0.80f)
                  pyramid(cw * 0.84f, ch * 0.40f, cw * 0.62f, cw * 0.81f, cw * 1.04f)

                  drawRect(
                      brush = Brush.verticalGradient(if (isNight) listOf(Color(0xFF1E1B2E), Color(0xFF090A10)) else listOf(Color(0xFFD97706), Color(0xFF78350F)), startY = horizonY, endY = ch),
                      topLeft = Offset(0f, horizonY),
                      size = Size(cw, ch - horizonY)
                  )
                  val nile = Path().apply {
                      moveTo(cw * 0.52f, horizonY)
                      quadraticBezierTo(cw * 0.32f, ch * 0.72f, cw * 0.22f, ch)
                      lineTo(cw, ch); lineTo(cw, ch * 0.80f)
                      quadraticBezierTo(cw * 0.78f, ch * 0.70f, cw * 0.66f, horizonY)
                      close()
                  }
                  drawPath(nile, Brush.verticalGradient(listOf(Color(0xFF38BDF8), Color(0xFF0284C7)), startY = horizonY, endY = ch))
              }
          }

          @Composable
          fun SettingsCardItem(title: String, subtitle: String, accent: Color, onClick: () -> Unit) {
              Column(
                  modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(Color(0xFF1E293B)).border(1.dp, accent.copy(alpha = 0.5f), RoundedCornerShape(16.dp)).clickable { onClick() }.padding(16.dp)
              ) {
                  Text(title, color = accent, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(4.dp))
                  Text(subtitle, color = Color.White.copy(alpha = 0.78f), fontSize = 12.sp)
              }
          }

          @Composable
          fun LinceAppRow(app: AppItem, textColor: Color, fontFamily: FontFamily, iconPackMode: String, iconSizeDp: Float, hideName: Boolean, horizontalShiftDp: Float, onClick: () -> Unit, onLongClick: () -> Unit) {
              val filter = remember(iconPackMode) {
                  when (iconPackMode) {
                      "gold_pharaoh" -> ColorFilter.colorMatrix(ColorMatrix(floatArrayOf(0f,0f,0f,0f,255f, 0f,0f,0f,0f,215f, 0f,0f,0f,0f,0f, 0f,0f,0f,1f,0f)))
                      "white_minimal" -> ColorFilter.colorMatrix(ColorMatrix(floatArrayOf(0f,0f,0f,0f,255f, 0f,0f,0f,0f,255f, 0f,0f,0f,0f,255f, 0f,0f,0f,1f,0f)))
                      "black_essence" -> ColorFilter.colorMatrix(ColorMatrix(floatArrayOf(0f,0f,0f,0f,18f, 0f,0f,0f,0f,24f, 0f,0f,0f,0f,39f, 0f,0f,0f,1f,0f)))
                      "neon_cyan" -> ColorFilter.colorMatrix(ColorMatrix(floatArrayOf(0f,0f,0f,0f,245f, 0f,0f,0f,0f,158f, 0f,0f,0f,0f,11f, 0f,0f,0f,1f,0f)))
                      else -> null
                  }
              }
              Row(
                  modifier = Modifier.fillMaxWidth().offset(x = horizontalShiftDp.dp).clip(RoundedCornerShape(14.dp))
                      .pointerInput(app.packageName) { detectTapGestures(onTap = { onClick() }, onLongPress = { onLongClick() }) }
                      .padding(horizontal = 4.dp, vertical = 7.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (iconPackMode == "default" && app.icon != null) {
                      Image(bitmap = app.icon.asImageBitmap(), contentDescription = null, modifier = Modifier.size(iconSizeDp.dp).clip(RoundedCornerShape(10.dp)))
                  } else {
                      val c = when (iconPackMode) {
                          "gold_pharaoh" -> Color(0xFFFFD700)
                          "black_essence" -> Color(0xFF111827)
                          "neon_cyan" -> Color(0xFFD97706)
                          else -> Color.White
                      }
                      val bgCircle = if (iconPackMode == "black_essence") Color.White.copy(alpha = 0.55f) else Color.Black.copy(alpha = 0.25f)
                      Box(modifier = Modifier.size(iconSizeDp.dp).background(bgCircle, CircleShape).border(1.8.dp, c, CircleShape), contentAlignment = Alignment.Center) {
                          if (app.icon != null && filter != null) {
                              Image(bitmap = app.icon.asImageBitmap(), contentDescription = null, colorFilter = filter, modifier = Modifier.size((iconSizeDp * 0.58f).dp).clip(CircleShape))
                          } else {
                              Text(app.initial.toString(), color = c, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  if (!hideName) {
                      Spacer(modifier = Modifier.width(16.dp))
                      Text(app.label, color = textColor, fontSize = 16.sp, fontFamily = fontFamily, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  }
              }
          }

          fun launchApp(context: Context, packageName: String) {
              context.packageManager.getLaunchIntentForPackage(packageName)?.let {
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(it)
              }
          }

          fun drawableToBitmap(drawable: Drawable): Bitmap {
              if (drawable is BitmapDrawable && drawable.bitmap != null) return drawable.bitmap
              val w = if (drawable.intrinsicWidth > 0) drawable.intrinsicWidth else 96
              val h = if (drawable.intrinsicHeight > 0) drawable.intrinsicHeight else 96
              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              val canvas = AndroidCanvas(bmp)
              drawable.setBounds(0, 0, canvas.width, canvas.height)
              drawable.draw(canvas)
              return bmp
          }
          EOF
          sed -i 's/^          //' app/src/main/java/com/atenea/pixelultralauncher/MainActivity.kt

          gradle assembleDebug --no-daemon

