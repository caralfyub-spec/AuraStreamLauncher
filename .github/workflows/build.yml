          // =========================================================================
          // FUNCIÓN PARA DIBUJAR EL FONDO DE LAS PIRÁMIDES DE EGIPTO Y EL RÍO NILO
          // =========================================================================
          fun drawEgyptianNileWallpaper(drawScope: DrawScope, cw: Float, ch: Float, isNight: Boolean) {
              with(drawScope) {
                  // 1. Cielo Egipcio (Atardecer Dorado de Ra o Noche Lapislázuli Estrellada)
                  val skyColors = if (isNight) {
                      listOf(Color(0xFF060B19), Color(0xFF0F1E3D), Color(0xFF1E3A5F), Color(0xFF2A2438))
                  } else {
                      listOf(Color(0xFF1B0E24), Color(0xFF4A1525), Color(0xFF9A3412), Color(0xFFD97706))
                  }
                  drawRect(brush = Brush.verticalGradient(colors = skyColors, startY = 0f, endY = ch * 0.65f))

                  // Estrellas si es Noche Faraónica
                  if (isNight) {
                      val stars = listOf(
                          Offset(cw * 0.15f, ch * 0.08f), Offset(cw * 0.45f, ch * 0.06f),
                          Offset(cw * 0.78f, ch * 0.11f), Offset(cw * 0.88f, ch * 0.22f),
                          Offset(cw * 0.28f, ch * 0.18f), Offset(cw * 0.62f, ch * 0.15f)
                      )
                      stars.forEach { st ->
                          drawCircle(Color(0xFFFEF08A).copy(alpha = 0.8f), radius = 3f, center = st)
                      }
                  }

                  // 2. El Gran Disco Solar de Ra / Luna Llena Dorada detrás de las Pirámides
                  val sunCenter = Offset(cw * 0.68f, ch * 0.36f)
                  drawCircle(
                      brush = Brush.radialGradient(
                          colors = listOf(
                              Color(0xFFFEF08A).copy(alpha = 0.9f),
                              Color(0xFFF59E0B).copy(alpha = 0.45f),
                              Color.Transparent
                          ),
                          center = sunCenter,
                          radius = cw * 0.42f
                      ),
                      radius = cw * 0.42f,
                      center = sunCenter
                  )
                  drawCircle(
                      color = Color(0xFFFEF9C3).copy(alpha = 0.88f),
                      radius = cw * 0.13f,
                      center = sunCenter
                  )

                  val horizonY = ch * 0.58f

                  // 3. Las 3 Pirámides de Giza en 3D (Cara iluminada + Cara en sombra + Punta Pyramidion de Oro)
                  fun drawPyramid3D(peakX: Float, peakY: Float, leftBaseX: Float, centerBaseX: Float, rightBaseX: Float, baseY: Float) {
                      // Cara iluminada (Izquierda)
                      val litSide = Path().apply {
                          moveTo(peakX, peakY)
                          lineTo(leftBaseX, baseY)
                          lineTo(centerBaseX, baseY)
                          close()
                      }
                      drawPath(
                          path = litSide,
                          color = if (isNight) Color(0xFF334155) else Color(0xFFD97706)
                      )
                      // Cara en sombra (Derecha)
                      val darkSide = Path().apply {
                          moveTo(peakX, peakY)
                          lineTo(centerBaseX, baseY)
                          lineTo(rightBaseX, baseY)
                          close()
                      }
                      drawPath(
                          path = darkSide,
                          color = if (isNight) Color(0xFF0F172A) else Color(0xFF451A03)
                      )
                      // Cúspide de Oro Real (Pyramidion)
                      val capRatio = 0.16f
                      val capY = peakY + (baseY - peakY) * capRatio
                      val capLeftX = peakX + (leftBaseX - peakX) * capRatio
                      val capCenterX = peakX + (centerBaseX - peakX) * capRatio
                      val capRightX = peakX + (rightBaseX - peakX) * capRatio
                      val goldCap = Path().apply {
                          moveTo(peakX, peakY)
                          lineTo(capLeftX, capY)
                          lineTo(capCenterX, capY)
                          lineTo(capRightX, capY)
                          close()
                      }
                      drawPath(goldCap, Color(0xFFFFD700))
                      // Arista dorada central
                      drawLine(Color(0xFFFFD700).copy(alpha = 0.7f), Offset(peakX, peakY), Offset(centerBaseX, baseY), strokeWidth = 2f)
                  }

                  // Pirámide lejana izquierda (Menkaure)
                  drawPyramid3D(cw * 0.25f, ch * 0.47f, cw * 0.08f, cw * 0.23f, cw * 0.38f, horizonY)
                  // Gran Pirámide central (Keops)
                  drawPyramid3D(cw * 0.56f, ch * 0.37f, cw * 0.28f, cw * 0.53f, cw * 0.80f, horizonY)
                  // Pirámide derecha (Kefrén)
                  drawPyramid3D(cw * 0.84f, ch * 0.41f, cw * 0.62f, cw * 0.81f, cw * 1.04f, horizonY)

                  // 4. Dunas del Desierto del Sáhara
                  val desertBg = Path().apply {
                      moveTo(0f, horizonY)
                      quadraticBezierTo(cw * 0.3f, horizonY - 18f, cw * 0.6f, horizonY + 8f)
                      quadraticBezierTo(cw * 0.85f, horizonY + 22f, cw, horizonY - 6f)
                      lineTo(cw, ch)
                      lineTo(0f, ch)
                      close()
                  }
                  drawPath(
                      path = desertBg,
                      brush = Brush.verticalGradient(
                          colors = if (isNight) {
                              listOf(Color(0xFF1E1B2E), Color(0xFF090A10))
                          } else {
                              listOf(Color(0xFF78350F), Color(0xFF271206))
                          },
                          startY = horizonY,
                          endY = ch
                      )
                  )

                  // 5. El Majestuoso Río Nilo serpenteando desde las pirámides hasta el borde inferior
                  val nileRiver = Path().apply {
                      moveTo(cw * 0.54f, horizonY + 4f)
                      quadraticBezierTo(cw * 0.32f, ch * 0.68f, cw * 0.45f, ch * 0.80f)
                      quadraticBezierTo(cw * 0.60f, ch * 0.90f, cw * 0.25f, ch)
                      lineTo(cw, ch)
                      lineTo(cw, ch * 0.82f)
                      quadraticBezierTo(cw * 0.82f, ch * 0.72f, cw * 0.66f, horizonY + 4f)
                      close()
                  }
                  drawPath(
                      path = nileRiver,
                      brush = Brush.verticalGradient(
                          colors = if (isNight) {
                              listOf(Color(0xFF0284C7), Color(0xFF1E3A8A), Color(0xFF090D16))
                          } else {
                              listOf(Color(0xFF0E7490), Color(0xFF0369A1), Color(0xFF082F49))
                          },
                          startY = horizonY,
                          endY = ch
                      )
                  )

                  // Reflejos de oro del Sol/Luna sobre las aguas del Nilo
                  for (i in 0..14) {
                      val ry = horizonY + 25f + i * ((ch - horizonY - 30f) / 15f)
                      val rxCenter = cw * 0.62f + sin(i * 0.7f) * (cw * 0.08f)
                      val halfLen = (18f + i * 5.5f)
                      drawLine(
                          color = Color(0xFFFFD700).copy(alpha = 0.55f),
                          start = Offset(rxCenter - halfLen, ry),
                          end = Offset(rxCenter + halfLen, ry),
                          strokeWidth = 3f,
                          cap = StrokeCap.Round
                      )
                  }
              }
          }

          // FUNCIÓN PARA DIBUJAR LA SILUETA DEL LINCE IBÉRICO EN CANVAS
          fun drawLinceSilhouette(drawScope: DrawScope, offset: Offset, size: Float, color: Color) {
              val p = Path().apply {
                  val ox = offset.x
                  val oy = offset.y
                  moveTo(ox, oy + size * 0.9f)
                  quadraticBezierTo(ox + size * 0.1f, oy + size * 0.4f, ox + size * 0.3f, oy + size * 0.35f)
                  lineTo(ox + size * 0.35f, oy + size * 0.12f)
                  lineTo(ox + size * 0.33f, oy - size * 0.08f)
                  lineTo(ox + size * 0.38f, oy + size * 0.15f)
                  lineTo(ox + size * 0.44f, oy + size * 0.08f)
                  lineTo(ox + size * 0.42f, oy - size * 0.12f)
                  lineTo(ox + size * 0.48f, oy + size * 0.15f)
                  quadraticBezierTo(ox + size * 0.52f, oy + size * 0.16f, ox + size * 0.58f, oy + size * 0.22f)
                  lineTo(ox + size * 0.65f, oy + size * 0.28f)
                  lineTo(ox + size * 0.58f, oy + size * 0.33f)
                  quadraticBezierTo(ox + size * 0.52f, oy + size * 0.45f, ox + size * 0.48f, oy + size * 0.52f)
                  quadraticBezierTo(ox + size * 0.44f, oy + size * 0.75f, ox + size * 0.42f, oy + size * 0.95f)
                  lineTo(ox + size * 0.36f, oy + size * 0.95f)
                  quadraticBezierTo(ox + size * 0.34f, oy + size * 0.7f, ox, oy + size * 0.9f)
                  close()
              }
              drawScope.drawPath(p, color)
          }

          @Composable
          fun SettingsCardItem(
              title: String,
              subtitle: String,
              accent: Color,
              onClick: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(16.dp))
                      .background(Color(0xFF1E1412))
                      .border(1.dp, accent.copy(alpha = 0.35f), RoundedCornerShape(16.dp))
                      .clickable { onClick() }
                      .padding(16.dp)
              ) {
                  Text(title, color = accent, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(4.dp))
                  Text(subtitle, color = Color.White.copy(alpha = 0.72f), fontSize = 13.sp)
              }
          }

          @Composable
          fun LinceAppRow(
              app: AppItem,
              textColor: Color,
              fontFamily: FontFamily,
              iconPackMode: String,
              iconSizeDp: Float,
              hideName: Boolean,
              horizontalShiftDp: Float,
              onClick: () -> Unit,
              onLongClick: () -> Unit
          ) {
              val iconColorFilter = remember(iconPackMode) {
                  when (iconPackMode) {
                      "gold_pharaoh" -> ColorFilter.colorMatrix(
                          ColorMatrix(
                              floatArrayOf(
                                  0f, 0f, 0f, 0f, 255f,
                                  0f, 0f, 0f, 0f, 215f,
                                  0f, 0f, 0f, 0f, 0f,
                                  0f, 0f, 0f, 1f, 0f
                              )
                          )
                      )
                      "white_minimal" -> ColorFilter.colorMatrix(
                          ColorMatrix(
                              floatArrayOf(
                                  0f, 0f, 0f, 0f, 255f,
                                  0f, 0f, 0f, 0f, 255f,
                                  0f, 0f, 0f, 0f, 255f,
                                  0f, 0f, 0f, 1f, 0f
                              )
                          )
                      )
                      "black_essence" -> ColorFilter.colorMatrix(
                          ColorMatrix(
                              floatArrayOf(
                                  0f, 0f, 0f, 0f, 18f,
                                  0f, 0f, 0f, 0f, 24f,
                                  0f, 0f, 0f, 0f, 39f,
                                  0f, 0f, 0f, 1f, 0f
                              )
                          )
                      )
                      "neon_cyan" -> ColorFilter.colorMatrix(
                          ColorMatrix(
                              floatArrayOf(
                                  0f, 0f, 0f, 0f, 245f,
                                  0f, 0f, 0f, 0f, 158f,
                                  0f, 0f, 0f, 0f, 11f,
                                  0f, 0f, 0f, 1f, 0f
                              )
                          )
                      )
                      else -> null
                  }
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .offset(x = horizontalShiftDp.dp)
                      .clip(RoundedCornerShape(14.dp))
                      .pointerInput(app.packageName) {
                          detectTapGestures(
                              onTap = { onClick() },
                              onLongPress = { onLongClick() }
                          )
                      }
                      .padding(horizontal = 4.dp, vertical = 7.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (iconPackMode == "default" && app.icon != null) {
                      Image(
                          bitmap = app.icon.asImageBitmap(),
                          contentDescription = null,
                          modifier = Modifier
                              .size(iconSizeDp.dp)
                              .clip(RoundedCornerShape(10.dp))
                      )
                  } else {
                      val glyphColor = when (iconPackMode) {
                          "gold_pharaoh" -> Color(0xFFFFD700)
                          "black_essence" -> Color(0xFF1E1412)
                          "neon_cyan" -> Color(0xFFF59E0B)
                          else -> Color.White
                      }
                      Box(
                          modifier = Modifier
                              .size(iconSizeDp.dp)
                              .background(Color.Black.copy(alpha = 0.28f), CircleShape)
                              .border(1.8.dp, glyphColor.copy(alpha = 0.75f), CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          if (app.icon != null && iconColorFilter != null) {
                              Image(
                                  bitmap = app.icon.asImageBitmap(),
                                  contentDescription = null,
                                  colorFilter = iconColorFilter,
                                  modifier = Modifier
                                      .size((iconSizeDp * 0.58f).dp)
                                      .clip(CircleShape)
                              )
                          } else {
                              Text(
                                  text = app.initial.toString(),
                                  color = glyphColor,
                                  fontSize = 14.sp,
                                  fontWeight = FontWeight.Bold
                              )
                          }
                      }
                  }

                  if (!hideName) {
                      Spacer(modifier = Modifier.width(16.dp))
                      Text(
                          text = app.label,
                          color = textColor,
                          fontSize = 16.sp,
                          fontFamily = fontFamily,
                          fontWeight = FontWeight.Medium,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

          fun launchApp(context: Context, packageName: String) {
              context.packageManager.getLaunchIntentForPackage(packageName)?.let {
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(it)
              }
          }

          fun drawableToBitmap(drawable: Drawable): Bitmap {
              if (drawable is BitmapDrawable && drawable.bitmap != null) return drawable.bitmap
              val w = if (drawable.intrinsicWidth > 0) drawable.intrinsicWidth else 96
              val h = if (drawable.intrinsicHeight > 0) drawable.intrinsicHeight else 96
              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              val canvas = AndroidCanvas(bmp)
              drawable.setBounds(0, 0, canvas.width, canvas.height)
              drawable.draw(canvas)
              return bmp
          }
          EOF
          sed -i 's/^          //' app/src/main/java/com/atenea/pixelultralauncher/MainActivity.kt

          gradle assembleDebug --no-daemon

      - name: 5. Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.${{ github.run_number }}
          name: "Lince Iberico & Egipto v7.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
