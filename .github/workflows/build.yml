                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // OLA ALFABÉTICA LATERAL (MANTIENE LA LETRA FIJA AL SOLTAR EL DEDO)
                  Box(
                      modifier = Modifier
                          .fillMaxHeight()
                          .width(72.dp)
                          .align(if (waveOnLeft) Alignment.CenterStart else Alignment.CenterEnd)
                          .pointerInput(containerSize, waveOnLeft) {
                              detectTapGestures(
                                  onPress = { offset ->
                                      handleWaveTouch(offset.y)
                                      tryAwaitRelease()
                                      touchY = null
                                      activeWaveIndex = null
                                  }
                              )
                          }
                          .pointerInput(containerSize, waveOnLeft) {
                              detectDragGestures(
                                  onDragStart = { offset -> handleWaveTouch(offset.y) },
                                  onDrag = { change, _ ->
                                      change.consume()
                                      handleWaveTouch(change.position.y)
                                  },
                                  onDragEnd = {
                                      touchY = null
                                      activeWaveIndex = null
                                  },
                                  onDragCancel = {
