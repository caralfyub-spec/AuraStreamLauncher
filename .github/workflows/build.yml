          // Extrae automáticamente el color dominante más vivo y el brillo de cualquier imagen importada
          fun extractSmartPalette(bmp: Bitmap): Pair<Int, Boolean> {
              var bestColor = 0xFFFFD700.toInt()
              var bestScore = -1f
              var totalLum = 0f
              var count = 0

              val stepX = (bmp.width / 12).coerceAtLeast(1)
              val stepY = (bmp.height / 12).coerceAtLeast(1)

              var x = stepX / 2
              while (x < bmp.width) {
                  var y = stepY / 2
                  while (y < bmp.height) {
                      val pixel = bmp.getPixel(x, y)
                      val r = (pixel shr 16) and 0xFF
                      val g = (pixel shr 8) and 0xFF
                      val b = pixel and 0xFF

                      val lum = (0.299f * r + 0.587f * g + 0.114f * b) / 255f
                      totalLum += lum
                      count++

                      val maxC = max(r, max(g, b)).toFloat()
                      val minC = min(r, min(g, b)).toFloat()
                      val sat = if (maxC > 0f) (maxC - minC) / maxC else 0f

                      // Preferimos colores vivos y legibles como color de acento
                      val score = sat * (1f - abs(lum - 0.6f))
                      if (score > bestScore && lum > 0.22f) {
                          bestScore = score
                          // Aseguramos brillo suficiente para que destaque en pantalla
                          val boostR = min(255, (r * 1.25f).roundToInt())
                          val boostG = min(255, (g * 1.25f).roundToInt())
                          val boostB = min(255, (b * 1.25f).roundToInt())
                          bestColor = (0xFF shl 24) or (boostR shl 16) or (boostG shl 8) or boostB
                      }
                      y += stepY
                  }
                  x += stepX
              }
              val avgLum = if (count > 0) totalLum / count else 0.2f
              val isDarkBg = avgLum < 0.62f
              return Pair(bestColor, isDarkBg)
          }

          fun parseImportedThemes(savedSet: Set<String>): List<ImportedThemeItem> {
              return savedSet.mapNotNull { entry ->
                  val parts = entry.split("|")
                  if (parts.size >= 6) {
                      ImportedThemeItem(
                          id = parts[0],
                          title = parts[1],
                          imagePath = parts[2],
                          accentColorInt = parts[3].toIntOrNull() ?: 0xFFFFD700.toInt(),
                          isDarkBg = parts[4].toBoolean(),
                          clockStyle = parts[5].toIntOrNull() ?: 1
                      )
                  } else null
              }.sortedByDescending { it.id }
          }

          fun serializeImportedThemes(list: List<ImportedThemeItem>): Set<String> {
              return list.map {
                  "${it.id}\vert{}${it.title}|${it.imagePath}\vert{}${it.accentColorInt}|${it.isDarkBg}\vert{}${it.clockStyle}"
              }.toSet()
          }

          // Intenta cargar iconos reales desde un paquete de iconos externo instalado en el teléfono
          fun loadIconFromExternalPack(
              context: Context,
              iconPackPkg: String,
              targetPkg: String,
              fallbackDrawable: Drawable
          ): Bitmap {
              if (iconPackPkg.isBlank()) return drawableToBitmap(fallbackDrawable)
              try {
                  val pm = context.packageManager
                  val packRes = pm.getResourcesForApplication(iconPackPkg)
                  val assetManager = packRes.assets
                  var drawableName: String? = null

                  val parserId = packRes.getIdentifier("appfilter", "xml", iconPackPkg)
                  if (parserId != 0) {
                      val parser = packRes.getXml(parserId)
                      var eventType = parser.eventType
                      while (eventType != XmlPullParser.END_DOCUMENT) {
                          if (eventType == XmlPullParser.START_TAG && parser.name == "item") {
                              val comp = parser.getAttributeValue(null, "component") ?: ""
                              if (comp.contains(targetPkg, ignoreCase = true)) {
                                  drawableName = parser.getAttributeValue(null, "drawable")
                                  break
                              }
                          }
                          eventType = parser.next()
                      }
                  }

                  if (!drawableName.isNullOrBlank()) {
                      val resId = packRes.getIdentifier(drawableName, "drawable", iconPackPkg)
                      if (resId != 0) {
                          val extDrawable = packRes.getDrawable(resId, null)
                          if (extDrawable != null) return drawableToBitmap(extDrawable)
                      }
                  }
              } catch (_: Exception) {}
              return drawableToBitmap(fallbackDrawable)
          }

          fun expandStatusBar(context: Context) {
              try {
                  val service = context.getSystemService("statusbar")
                  val statusbarManager = Class.forName("android.app.StatusBarManager")
                  val expand = statusbarManager.getMethod("expandNotificationsPanel")
                  expand.invoke(service)
              } catch (_: Exception) {}
          }

          fun getBatteryPercentage(context: Context): Int {
              return try {
                  val intent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = intent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = intent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  if (level >= 0 && scale > 0) (level * 100) / scale else 100
              } catch (_: Exception) {
                  100
              }
          }

