          val LINCE_INDEX: List<Char> = listOf('★') + ('A'..'Z').toList() + listOf('#')

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  setContent {
                      LinceIbericoLauncher()
                  }
              }
          }

          fun expandStatusBar(context: Context) {
              try {
                  val service = context.getSystemService("statusbar")
                  val statusbarManager = Class.forName("android.app.StatusBarManager")
                  val expand = statusbarManager.getMethod("expandNotificationsPanel")
                  expand.invoke(service)
              } catch (_: Exception) {}
          }

          fun getBatteryPercentage(context: Context): Int {
              return try {
                  val intent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = intent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = intent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  if (level >= 0 && scale > 0) (level * 100) / scale else 100
              } catch (_: Exception) {
                  100
              }
          }

          @Composable
          fun LinceIbericoLauncher() {
              val context = LocalContext.current
              val view = LocalView.current
              val density = LocalDensity.current
              val prefs = remember { context.getSharedPreferences("lince_iberico_v7_prefs", Context.MODE_PRIVATE) }

              val isFirstRun = remember { prefs.getBoolean("first_run_v7", true) }
              var currentScreen by remember {
                  mutableStateOf(if (isFirstRun) "WELCOME" else "HOME")
              }

              // Por defecto arranca con el nuevo tema del Nilo y la Pirámide Egipcia (puedes cambiarlo en Temas)
              var wallpaperStyle by remember {
                  mutableStateOf(prefs.getString("wallpaper_style", "nilo_piramides") ?: "nilo_piramides")
              }
              var customWallpaperBitmap by remember { mutableStateOf<Bitmap?>(null) }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      val customFile = File(context.filesDir, "custom_lince_wallpaper.jpg")
                      if (customFile.exists()) {
                          val bmp = BitmapFactory.decodeFile(customFile.absolutePath)
                          withContext(Dispatchers.Main) {
                              customWallpaperBitmap = bmp
                          }
                      }
                  }
              }

              val galleryLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      try {
                          val inputStream = context.contentResolver.openInputStream(uri)
                          val bmp = BitmapFactory.decodeStream(inputStream)
                          inputStream?.close()
                          if (bmp != null) {
                              customWallpaperBitmap = bmp
                              wallpaperStyle = "custom_gallery"
                              prefs.edit().putString("wallpaper_style", "custom_gallery").apply()
                              val outFile = File(context.filesDir, "custom_lince_wallpaper.jpg")
                              FileOutputStream(outFile).use { out ->
                                  bmp.compress(Bitmap.CompressFormat.JPEG, 90, out)
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              var iconPackMode by remember {
                  mutableStateOf(prefs.getString("icon_pack", "gold_pharaoh") ?: "gold_pharaoh")
              }
              var textColorMode by remember {
                  mutableStateOf(prefs.getString("text_color_mode", "light") ?: "light")
              }
              var fontMode by remember {
                  mutableStateOf(prefs.getString("font_mode", "serif") ?: "serif")
              }
              var clockStyle by remember {
                  mutableStateOf(prefs.getInt("clock_style", 0))
              }
              var showCalendarDate by remember {
                  mutableStateOf(prefs.getBoolean("show_date", true))
              }
              var showWeather by remember {
                  mutableStateOf(prefs.getBoolean("show_weather", true))
              }
              var showBattery by remember {
                  mutableStateOf(prefs.getBoolean("show_battery", true))
              }
              // 1=Orejas Lince, 2=Huella Lince, 3=Mirada Doñana, 4=Reloj Solar Egipcio de Ra, 5=Cartucho Faraónico
              var linceClockStyle by remember {
                  mutableStateOf(prefs.getInt("lince_clock_style", 4))
              }
              var hideAlphabet by remember {
                  mutableStateOf(prefs.getBoolean("hide_alphabet", false))
              }
              var hideFavoriteNames by remember {
                  mutableStateOf(prefs.getBoolean("hide_fav_names", false))
              }
              var showLinceButton by remember {
                  mutableStateOf(prefs.getBoolean("show_lince_btn", true))
              }
              var waveOnLeft by remember {
                  mutableStateOf(prefs.getBoolean("wave_left", false))
              }
              var iconSizeDp by remember {
                  mutableStateOf(prefs.getFloat("icon_size", 44f))
              }
              var verticalOffsetDp by remember {
                  mutableStateOf(prefs.getFloat("vertical_offset", 20f))
              }
              var isMovingWidgetMode by remember { mutableStateOf(false) }

              var favoritePackages by remember {
                  val saved = prefs.getStringSet("favorites", null)
                  mutableStateOf(saved?.toSet() ?: emptySet<String>())
              }

              var apps by remember { mutableStateOf<List<AppItem>>(emptyList()) }
              var searchQuery by remember { mutableStateOf("") }
              var favSearchQuery by remember { mutableStateOf("") }
              var isSearching by remember { mutableStateOf(false) }

              var showLinceWidgetSheet by remember { mutableStateOf(false) }
              var showLinceClockPicker by remember { mutableStateOf(false) }
              var selectedAppForMenu by remember { mutableStateOf<AppItem?>(null) }

              var activeChar by remember { mutableStateOf<Char>('★') }
              var activeWaveIndex by remember { mutableStateOf<Int?>(null) }
              var touchY by remember { mutableStateOf<Float?>(null) }
              var containerSize by remember { mutableStateOf(IntSize(1080, 2400)) }

              val listState = rememberLazyListState()

              var currentTime by remember { mutableStateOf("") }
              var currentDateShort by remember { mutableStateOf("") }
              var currentDayName by remember { mutableStateOf("JUEVES") }
              var currentDayNumber by remember { mutableStateOf("05") }
              var batteryLevel by remember { mutableStateOf(100) }
              var hourFloat by remember { mutableStateOf(10f) }
              var minuteFloat by remember { mutableStateOf(10f) }

              LaunchedEffect(Unit) {
                  while (true) {
                      val now = Date()
                      val cal = Calendar.getInstance()
                      currentTime = DateFormat.format("HH:mm", now).toString()
                      currentDateShort = DateFormat.format("EEE, d MMM", now).toString()
                      currentDayName = DateFormat.format("EEEE", now).toString().uppercase()
                      currentDayNumber = DateFormat.format("dd", now).toString()
                      hourFloat = (cal.get(Calendar.HOUR) + cal.get(Calendar.MINUTE) / 60f)
                      minuteFloat = cal.get(Calendar.MINUTE).toFloat()
                      batteryLevel = getBatteryPercentage(context)
                      delay(1000L)
                  }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      val pm = context.packageManager
                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }
                      val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
                      val loadedApps = resolveInfos.mapNotNull { ri ->
                          val pkg = ri.activityInfo.packageName
                          if (pkg == context.packageName) return@mapNotNull null
                          val label = ri.loadLabel(pm)?.toString()?.trim() ?: pkg
                          val firstChar = if (label.isNotEmpty()) label[0].uppercaseChar() else '#'
                          val initial = if (firstChar in 'A'..'Z') firstChar else '#'
                          val drawable = ri.loadIcon(pm)
                          AppItem(
                              label = label,
                              packageName = pkg,
                              icon = drawableToBitmap(drawable),
                              initial = initial
                          )
                      }.sortedBy { it.label.lowercase() }

                      withContext(Dispatchers.Main) {
                          apps = loadedApps
                          if (favoritePackages.isEmpty() && loadedApps.isNotEmpty()) {
                              val defaultFavs = loadedApps.take(6).map { it.packageName }.toSet()
                              favoritePackages = defaultFavs
                              prefs.edit().putStringSet("favorites", defaultFavs).apply()
                          }
                      }
                  }
              }

              val appFontFamily = remember(fontMode) {
                  when (fontMode) {
                      "serif" -> FontFamily.Serif
                      "mono" -> FontFamily.Monospace
                      else -> FontFamily.SansSerif
                  }
              }

              val isDarkText = textColorMode == "dark"
              val isEgyptianTheme = wallpaperStyle == "nilo_piramides" || wallpaperStyle == "noche_faraonica"

              val primaryTextColor = when {
                  isDarkText -> Color(0xFF1C1917)
                  isEgyptianTheme -> Color(0xFFFEF9C3)
                  else -> Color(0xFFFEF08A)
              }
              val secondaryTextColor = when {
                  isDarkText -> Color(0xFF78350F)
                  isEgyptianTheme -> Color(0xFFEAB308)
                  else -> Color(0xFFCA8A04)
              }
              val accentColor = if (isEgyptianTheme) Color(0xFFFFD700) else Color(0xFFF59E0B)
              val dialogBgColor = Color(0xFF181311)

              fun applyThemePreset(preset: LinceThemePreset) {
                  wallpaperStyle = preset.wallpaper
                  iconPackMode = preset.iconPack
                  textColorMode = preset.textColor
                  clockStyle = preset.clockStyle
                  linceClockStyle = preset.linceClockStyle
                  hideAlphabet = preset.hideAlphabet
                  showCalendarDate = true
                  prefs.edit()
                      .putString("wallpaper_style", wallpaperStyle)
                      .putString("icon_pack", iconPackMode)
                      .putString("text_color_mode", textColorMode)
                      .putInt("clock_style", clockStyle)
                      .putInt("lince_clock_style", linceClockStyle)
                      .putBoolean("hide_alphabet", hideAlphabet)
                      .putBoolean("show_date", showCalendarDate)
                      .apply()
              }

              // =========================================================================
              // PANTALLA 1: BIENVENIDA
              // =========================================================================
              if (currentScreen == "WELCOME") {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(
                              Brush.verticalGradient(
                                  colors = listOf(Color(0xFF271C19), Color(0xFF140D0B))
                              )
                          )
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(28.dp)
                  ) {
                      Column(
                          modifier = Modifier.fillMaxSize(),
                          verticalArrangement = Arrangement.SpaceBetween
                      ) {
                          Spacer(modifier = Modifier.height(20.dp))
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  text = "Lince Ibérico & Egipto",
                                  color = accentColor,
                                  fontSize = 30.sp,
                                  fontWeight = FontWeight.Bold,
                                  letterSpacing = 1.sp
                              )
                              Spacer(modifier = Modifier.height(18.dp))
                              Text(
                                  text = "Naturaleza salvaje ibérica y los misterios del Nilo y las Pirámides en tu pantalla.",
                                  color = Color.White,
                                  fontSize = 21.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  lineHeight = 28.sp
                              )
                              Spacer(modifier = Modifier.height(14.dp))
                              Text(
                                  text = "Elige tus aplicaciones favoritas para el inicio y personaliza al instante entre los temas del Lince Ibérico y el Antiguo Egipto.",
                                  color = Color.White.copy(alpha = 0.78f),
                                  fontSize = 15.sp,
                                  lineHeight = 22.sp
                              )
                          }
                          Button(
                              onClick = { currentScreen = "FAVORITES" },
                              colors = ButtonDefaults.buttonColors(containerColor = accentColor),
                              shape = RoundedCornerShape(28.dp),
