                                  4 -> {
                                      // 4. RELOJ SOLAR EGIPCIO DE RA Y OJO DE HORUS
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text(
                                              text = "☥  SOL DE RA • VALLE DEL NILO  ☥",
                                              color = Color(0xFFFFD700),
                                              fontSize = 10.sp,
                                              fontWeight = FontWeight.Bold,
                                              letterSpacing = 2.sp
