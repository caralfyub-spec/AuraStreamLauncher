                          Text("Configuración Completa", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                      }
                      SettingsCardItem("🌈  Color de la Barra de Letras (Arcoíris, Fuego, Océano...)", "Elige entre 12 colores y degradados para las letras A-Z y la burbuja", Color(0xFF00E5FF)) { currentScreen = "HOME"; showWaveColorPicker = true }
                      SettingsCardItem("✨  Temas (Lince Luminoso, Niagara Launcher y Egipto)", "11 temas completos de 1 toque: Lince Claro, Olas Japonesas, Costa, Nilo...", Color(0xFFFFD700)) { currentScreen = "THEMES" }
