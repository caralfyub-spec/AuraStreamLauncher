              }

              if (currentScreen == "WELCOME") {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(
                              Brush.verticalGradient(
                                  colors = listOf(Color(0xFF433878), Color(0xFF2E236C), Color(0xFF17153B))
                              )
                          )
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(28.dp)
                  ) {
                      Column(
                          modifier = Modifier.fillMaxSize(),
                          verticalArrangement = Arrangement.SpaceBetween
                      ) {
                          Spacer(modifier = Modifier.height(20.dp))
                          Column {
                              Text(
                                  text = "De distracciones y desorden a un ambiente enfocado y limpio.",
                                  color = Color.White,
                                  fontSize = 28.sp,
                                  fontWeight = FontWeight.Bold,
                                  lineHeight = 36.sp
                              )
                              Spacer(modifier = Modifier.height(14.dp))
                              Text(
                                  text = "Bienvenido a tu clon completo de Niagara Launcher 2026. Ahora vas a elegir tus aplicaciones favoritas para la pantalla de inicio.",
                                  color = Color.White.copy(alpha = 0.78f),
                                  fontSize = 15.sp,
                                  lineHeight = 22.sp
                              )
                          }
                          Button(
                              onClick = { currentScreen = "FAVORITES" },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF6366F1)),
                              shape = RoundedCornerShape(28.dp),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(56.dp)
                          ) {
                              Text("Comenzar y elegir Favoritos  ➔", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  return
              }

              if (currentScreen == "FAVORITES") {
                  val filteredForPicker = remember(apps, favSearchQuery) {
                      if (favSearchQuery.isBlank()) apps
                      else apps.filter { it.label.contains(favSearchQuery.trim(), ignoreCase = true) }
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color(0xFF1E1B4B))
                          .statusBarsPadding()
                          .navigationBarsPadding()
                  ) {
                      Column(modifier = Modifier.fillMaxSize()) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
