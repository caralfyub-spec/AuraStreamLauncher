                  }
              }

              // Selector 2: MOTOR CAMALEÓN (Importa imagen/captura de otra app -> extrae colores -> crea Tema Completo en 1 clic)
              val magicThemeFromImageLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      try {
                          val inputStream = context.contentResolver.openInputStream(uri)
                          val bmp = BitmapFactory.decodeStream(inputStream)
                          inputStream?.close()
                          if (bmp != null) {
                              val extractedHex = extractVibrantColor(bmp)
                              customWallpaperBitmap = bmp
                              wallpaperStyle = "custom_gallery"
                              customAccentHex = extractedHex
                              iconPackMode = "custom_accent"
                              val outFile = File(context.filesDir, "custom_lince_wallpaper.jpg")
                              FileOutputStream(outFile).use { out ->
                                  bmp.compress(Bitmap.CompressFormat.JPEG, 90, out)
                              }
                              prefs.edit()
                                  .putString("wallpaper_style", "custom_gallery")
                                  .putInt("custom_accent_hex", extractedHex)
                                  .putString("icon_pack", "custom_accent")
                                  .apply()

                              saveImportedTheme(
                                  title = "Tema Camaleón (${importedThemePresets.size + 1})",
                                  subtitle = "Extraído automáticamente de tu imagen e incorporado",
                                  wallStyle = "custom_gallery",
                                  iconMode = "custom_accent",
                                  colorHex = extractedHex
                              )
                              Toast.makeText(context, "¡Tema extraído e incorporado con éxito!", Toast.LENGTH_SHORT).show()
                              currentScreen = "HOME"
                          }
                      } catch (_: Exception) {}
                  }
              }

              // Selector 3: Importar archivo de tema (.json / .txt) desde otras apps o gestor de archivos
              val themeFileImporter = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      try {
                          val text = context.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""
                          val hexMatch = Regex("#([0-9A-Fa-f]{6})").find(text)
                          val parsedColor = if (hexMatch != null) {
                              AndroidColor.parseColor(hexMatch.value)
                          } else {
                              0xFF38BDF8.toInt()
                          }
                          customAccentHex = parsedColor
                          iconPackMode = "custom_accent"
                          prefs.edit()
                              .putInt("custom_accent_hex", parsedColor)
                              .putString("icon_pack", "custom_accent")
                              .apply()
                          saveImportedTheme(
                              title = "Tema de Archivo Externo",
                              subtitle = "Importado desde archivo de configuración",
                              wallStyle = wallpaperStyle,
                              iconMode = "custom_accent",
                              colorHex = parsedColor
                          )
                          Toast.makeText(context, "¡Archivo de tema importado y aplicado!", Toast.LENGTH_SHORT).show()
                          currentScreen = "HOME"
                      } catch (_: Exception) {}
                  }
              }

              LaunchedEffect(Unit) {
                  while (true) {
                      val now = Date()
                      val cal = Calendar.getInstance()
                      currentTime = DateFormat.format("HH:mm", now).toString()
                      currentDateShort = DateFormat.format("EEE, d MMM", now).toString()
                      currentDayName = DateFormat.format("EEEE", now).toString().uppercase()
                      currentDayNumber = DateFormat.format("dd", now).toString()
                      hourFloat = (cal.get(Calendar.HOUR) + cal.get(Calendar.MINUTE) / 60f)
                      minuteFloat = cal.get(Calendar.MINUTE).toFloat()
                      batteryLevel = getBatteryPercentage(context)
                      delay(1000L)
                  }
              }

              // Carga de aplicaciones + Detección de Icon Packs externos instalados + Aplicación de iconos externos
              LaunchedEffect(externalIconPackPkg) {
                  withContext(Dispatchers.IO) {
                      val pm = context.packageManager
                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }
                      val resolveInfos = pm.queryIntentActivities(mainIntent, 0)

                      // Detectar apps que son Icon Packs dedicados (Nova, ADW, Apex, Go, Lawnchair)
                      val iconPackPackages = mutableSetOf<String>()
                      val themeActions = listOf(
                          "org.adw.launcher.THEMES",
                          "com.novalauncher.THEME",
                          "com.anddoes.launcher.THEME",
                          "com.gau.go.launcherex.theme"
                      )
                      themeActions.forEach { action ->
                          try {
                              val packs = pm.queryIntentActivities(Intent(action), 0)
                              packs.forEach { ri -> iconPackPackages.add(ri.activityInfo.packageName) }
                          } catch (_: Exception) {}
                      }

                      // Si el usuario seleccionó un Icon Pack externo, cargamos su mapa de iconos
                      val (extRes, extMap) = if (externalIconPackPkg.isNotBlank()) {
                          loadExternalIconPackMap(pm, externalIconPackPkg)
                      } else {
                          Pair(null, emptyMap())
                      }

                      val loadedApps = resolveInfos.mapNotNull { ri ->
                          val pkg = ri.activityInfo.packageName
                          if (pkg == context.packageName) return@mapNotNull null
                          val label = ri.loadLabel(pm)?.toString()?.trim() ?: pkg
                          val firstChar = if (label.isNotEmpty()) label[0].uppercaseChar() else '#'
                          val initial = if (firstChar in 'A'..'Z') firstChar else '#'

                          // Si hay un Icon Pack externo activo y tiene icono para esta app, lo usamos
                          var finalBitmap: Bitmap? = null
                          if (extRes != null && extMap.containsKey(pkg)) {
                              try {
                                  val drawableName = extMap[pkg] ?: ""
                                  val id = extRes.getIdentifier(drawableName, "drawable", externalIconPackPkg)
                                  if (id != 0) {
                                      val extDrawable = extRes.getDrawable(id, null)
                                      if (extDrawable != null) {
                                          finalBitmap = drawableToBitmap(extDrawable)
                                      }
                                  }
                              } catch (_: Exception) {}
                          }

                          if (finalBitmap == null) {
                              val drawable = ri.loadIcon(pm)
                              finalBitmap = drawableToBitmap(drawable)
                          }

                          AppItem(
                              label = label,
                              packageName = pkg,
                              icon = finalBitmap,
                              initial = initial
                          )
                      }.sortedBy { it.label.lowercase() }

                      // Construir lista de packs de temas y apps para importar estilo en 1 toque
                      val themeCandidates = loadedApps.map { app ->
                          val isPack = app.packageName in iconPackPackages ||
                              app.label.contains("icon", ignoreCase = true) ||
                              app.label.contains("theme", ignoreCase = true) ||
                              app.label.contains("tema", ignoreCase = true) ||
                              app.label.contains("pack", ignoreCase = true) ||
                              app.label.contains("kwgt", ignoreCase = true) ||
                              app.label.contains("wall", ignoreCase = true)
                          ExternalThemePack(
                              label = app.label,
                              packageName = app.packageName,
                              icon = app.icon,
                              isDedicatedIconPack = isPack,
                              dominantColorHex = extractVibrantColor(app.icon)
                          )
                      }.sortedByDescending { it.isDedicatedIconPack }

                      withContext(Dispatchers.Main) {
                          apps = loadedApps
                          detectedThemePacks = themeCandidates
                          if (favoritePackages.isEmpty() && loadedApps.isNotEmpty()) {
                              val defaultFavs = loadedApps.take(6).map { it.packageName }.toSet()
                              favoritePackages = defaultFavs
                              prefs.edit().putStringSet("favorites", defaultFavs).apply()
                          }
                      }
                  }
              }

              val appFontFamily = remember(fontMode) {
                  when (fontMode) {
                      "serif" -> FontFamily.Serif
                      "mono" -> FontFamily.Monospace
                      else -> FontFamily.SansSerif
                  }
              }

              val isDarkText = textColorMode == "dark"
              val isEgyptianTheme = wallpaperStyle == "nilo_piramides" || wallpaperStyle == "noche_faraonica"

              val accentColor = when {
                  customAccentHex != 0 && (iconPackMode == "custom_accent" || externalIconPackPkg.isNotBlank()) -> Color(customAccentHex)
                  isEgyptianTheme -> Color(0xFFFFD700)
                  else -> Color(0xFFF59E0B)
              }

              val primaryTextColor = when {
                  isDarkText -> Color(0xFF1C1917)
                  isEgyptianTheme -> Color(0xFFFEF9C3)
                  else -> Color(0xFFF8FAFC)
              }
              val secondaryTextColor = when {
                  isDarkText -> Color(0xFF78350F)
                  else -> accentColor.copy(alpha = 0.85f)
              }
              val dialogBgColor = Color(0xFF181311)

              fun applyThemePreset(preset: LinceThemePreset) {
                  wallpaperStyle = preset.wallpaper
                  iconPackMode = preset.iconPack
                  textColorMode = preset.textColor
                  clockStyle = preset.clockStyle
                  linceClockStyle = preset.linceClockStyle
                  hideAlphabet = preset.hideAlphabet
                  showCalendarDate = true
                  customAccentHex = preset.customAccentHex ?: 0
                  externalIconPackPkg = preset.externalPackPkg ?: ""

                  prefs.edit()
                      .putString("wallpaper_style", wallpaperStyle)
                      .putString("icon_pack", iconPackMode)
                      .putString("text_color_mode", textColorMode)
                      .putInt("clock_style", clockStyle)
                      .putInt("lince_clock_style", linceClockStyle)
                      .putBoolean("hide_alphabet", hideAlphabet)
                      .putBoolean("show_date", showCalendarDate)
                      .putInt("custom_accent_hex", customAccentHex)
                      .putString("external_icon_pack_pkg", externalIconPackPkg)
                      .apply()
              }

              // =========================================================================
              // PANTALLA NUEVA: IMPORTADOR SIMPLE DE TEMAS DE OTRAS APPS (1 TOQUE)
              // =========================================================================
              if (currentScreen == "IMPORT_THEMES") {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color(0xFF110D0C))
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(horizontal = 20.dp, vertical = 14.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = { currentScreen = "HOME" }) {
                              Icon(Icons.Default.ArrowBack, contentDescription = "Volver", tint = Color.White)
                          }
                          Spacer(modifier = Modifier.width(6.dp))
                          Column {
                              Text("Importar Tema Externo", color = accentColor, fontSize = 21.sp, fontWeight = FontWeight.Bold)
                              Text("Elige cómo quieres incorporar el tema en 1 toque", color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(14.dp))

                      // OPCIÓN 1: CREAR TEMA AUTOMÁTICO DESDE IMAGEN / CAPTURA DE OTRA APP
                      Button(
                          onClick = { magicThemeFromImageLauncher.launch("image/*") },
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF38BDF8)),
                          shape = RoundedCornerShape(16.dp),
                          modifier = Modifier.fillMaxWidth().height(54.dp)
                      ) {
                          Text("🖼  1. Crear Tema desde Imagen o Captura", color = Color.Black, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                      }

                      Spacer(modifier = Modifier.height(8.dp))

                      // OPCIÓN 2: IMPORTAR DESDE ARCHIVO O PORTAPAPELES
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Button(
                              onClick = { themeFileImporter.launch("*/*") },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF34D399)),
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier.weight(1f).height(48.dp)
                          ) {
                              Text("📂 Importar Archivo", color = Color.Black, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          }

                          Button(
                              onClick = {
                                  try {
                                      val cb = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                      val clipText = cb.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                                      val hexMatch = Regex("#([0-9A-Fa-f]{6})").find(clipText)
                                      val colorInt = if (hexMatch != null) {
                                          AndroidColor.parseColor(hexMatch.value)
                                      } else {
                                          0xFFA855F7.toInt()
                                      }
                                      customAccentHex = colorInt
                                      iconPackMode = "custom_accent"
                                      prefs.edit()
                                          .putInt("custom_accent_hex", colorInt)
                                          .putString("icon_pack", "custom_accent")
                                          .apply()
                                      saveImportedTheme(
                                          title = "Tema del Portapapeles",
                                          subtitle = "Importado por código rápido",
                                          wallStyle = wallpaperStyle,
                                          iconMode = "custom_accent",
                                          colorHex = colorInt
                                      )
                                      Toast.makeText(context, "¡Tema pegado e incorporado!", Toast.LENGTH_SHORT).show()
                                      currentScreen = "HOME"
                                  } catch (_: Exception) {}
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFA855F7)),
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier.weight(1f).height(48.dp)
                          ) {
                              Text("📋 Pegar Tema", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          }
                      }

                      Spacer(modifier = Modifier.height(14.dp))
                      Divider(color = Color.White.copy(alpha = 0.15f))
                      Spacer(modifier = Modifier.height(10.dp))

                      // OPCIÓN 3: APLICAR PAQUETES DE ICONOS O EXTRAER TEMA DE APPS INSTALADAS EN 1 TOQUE
                      Text(
                          text = "📦 3. Toca cualquier Paquete de Iconos o App de tu móvil para importar sus iconos y colores automáticamente:",
                          color = Color(0xFFFFD700),
                          fontSize = 13.sp,
                          fontWeight = FontWeight.Bold
                      )
                      Spacer(modifier = Modifier.height(8.dp))

                      LazyColumn(
                          modifier = Modifier.weight(1f),
                          verticalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          items(detectedThemePacks, key = { "pack_${it.packageName}" }) { pack ->
                              val packColor = Color(pack.dominantColorHex)
                              val isCurrentlyActive = externalIconPackPkg == pack.packageName
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(14.dp))
                                      .background(if (isCurrentlyActive) packColor.copy(alpha = 0.25f) else Color(0xFF1E1614))
                                      .border(
                                          1.2.dp,
                                          if (pack.isDedicatedIconPack) Color(0xFFFFD700) else packColor.copy(alpha = 0.5f),
                                          RoundedCornerShape(14.dp)
                                      )
                                      .clickable {
                                          externalIconPackPkg = pack.packageName
                                          customAccentHex = pack.dominantColorHex
                                          iconPackMode = if (pack.isDedicatedIconPack) "default" else "custom_accent"
                                          prefs.edit()
                                              .putString("external_icon_pack_pkg", pack.packageName)
                                              .putInt("custom_accent_hex", pack.dominantColorHex)
                                              .putString("icon_pack", iconPackMode)
                                              .apply()

                                          saveImportedTheme(
                                              title = "Tema ${pack.label}",
                                              subtitle = if (pack.isDedicatedIconPack) "Icon Pack externo + Colores" else "Colores y estilo extraídos de ${pack.label}",
                                              wallStyle = wallpaperStyle,
                                              iconMode = iconPackMode,
                                              colorHex = pack.dominantColorHex,
                                              extPkg = pack.packageName
                                          )
                                          Toast.makeText(context, "¡Tema e iconos de ${pack.label} aplicados!", Toast.LENGTH_SHORT).show()
                                          currentScreen = "HOME"
                                      }
                                      .padding(12.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  if (pack.icon != null) {
                                      Image(
                                          bitmap = pack.icon.asImageBitmap(),
                                          contentDescription = null,
                                          modifier = Modifier.size(40.dp).clip(RoundedCornerShape(10.dp))
                                      )
                                  }
                                  Spacer(modifier = Modifier.width(12.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text(pack.label, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                                          if (pack.isDedicatedIconPack) {
                                              Spacer(modifier = Modifier.width(6.dp))
                                              Box(
                                                  modifier = Modifier
                                                      .clip(RoundedCornerShape(6.dp))
                                                      .background(Color(0xFFFFD700))
                                                      .padding(horizontal = 6.dp, vertical = 2.dp)
                                              ) {
                                                  Text("ICON PACK", color = Color.Black, fontSize = 9.sp, fontWeight = FontWeight.ExtraBold)
                                              }
                                          }
                                      }
                                      Text(
                                          text = if (pack.isDedicatedIconPack) "Toca para cargar sus iconos y tema" else "Toca para clonar su paleta de color",
                                          color = Color.White.copy(alpha = 0.65f),
                                          fontSize = 11.sp
                                      )
                                  }
                                  Box(
                                      modifier = Modifier
                                          .size(24.dp)
                                          .clip(CircleShape)
                                          .background(packColor)
                                          .border(1.dp, Color.White, CircleShape)
                                  )
                              }
                          }
                      }
                  }
                  return
              }

              // =========================================================================
              // PANTALLA 1: BIENVENIDA
              // =========================================================================
              if (currentScreen == "WELCOME") {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(
                              Brush.verticalGradient(
                                  colors = listOf(Color(0xFF271C19), Color(0xFF140D0B))
                              )
                          )
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(28.dp)
                  ) {
                      Column(
                          modifier = Modifier.fillMaxSize(),
                          verticalArrangement = Arrangement.SpaceBetween
                      ) {
                          Spacer(modifier = Modifier.height(20.dp))
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  text = "Lince Ibérico & Egipto",
                                  color = accentColor,
                                  fontSize = 30.sp,
                                  fontWeight = FontWeight.Bold,
                                  letterSpacing = 1.sp
                              )
                              Spacer(modifier = Modifier.height(18.dp))
                              Text(
                                  text = "Naturaleza salvaje ibérica, el Nilo Egipcio e Importador Universal de Temas.",
                                  color = Color.White,
                                  fontSize = 21.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  lineHeight = 28.sp
                              )
                              Spacer(modifier = Modifier.height(14.dp))
                              Text(
                                  text = "Elige tus aplicaciones favoritas para el inicio y personaliza en un toque con temas propios o importados de otras apps.",
                                  color = Color.White.copy(alpha = 0.78f),
                                  fontSize = 15.sp,
                                  lineHeight = 22.sp
                              )
                          }
                          Button(
                              onClick = { currentScreen = "FAVORITES" },
                              colors = ButtonDefaults.buttonColors(containerColor = accentColor),
                              shape = RoundedCornerShape(28.dp),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(56.dp)
                          ) {
                              Text("Elegir aplicaciones favoritas  🐾 ☥", color = Color.Black, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  return
              }

              // =========================================================================
              // PANTALLA 2: SELECTOR DE FAVORITOS
              // =========================================================================
              if (currentScreen == "FAVORITES") {
                  val filteredForPicker = remember(apps, favSearchQuery) {
                      if (favSearchQuery.isBlank()) apps
                      else apps.filter { it.label.contains(favSearchQuery.trim(), ignoreCase = true) }
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color(0xFF140D0B))
                          .statusBarsPadding()
                          .navigationBarsPadding()
                  ) {
                      Column(modifier = Modifier.fillMaxSize()) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(Color(0xFF271C19))
                                  .padding(horizontal = 20.dp, vertical = 18.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "Tus Favoritos",
                                      color = accentColor,
                                      fontSize = 24.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(16.dp))
                                          .background(accentColor.copy(alpha = 0.2f))
                                          .padding(horizontal = 12.dp, vertical = 6.dp)
                                  ) {
                                      Text(
                                          text = "${favoritePackages.size} marcadas",
                                          color = accentColor,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(
                                  text = "Marca las aplicaciones que mantendrás fijas en la pantalla principal (4 a 8 recomendadas).",
                                  color = Color.White.copy(alpha = 0.78f),
                                  fontSize = 13.sp
                              )
                              Spacer(modifier = Modifier.height(12.dp))
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(20.dp))
                                      .background(Color.White.copy(alpha = 0.14f))
                                      .padding(horizontal = 14.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(Icons.Default.Search, contentDescription = null, tint = Color.White, modifier = Modifier.size(18.dp))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  BasicTextField(
                                      value = favSearchQuery,
                                      onValueChange = { favSearchQuery = it },
                                      singleLine = true,
                                      textStyle = TextStyle(color = Color.White, fontSize = 15.sp),
                                      cursorBrush = SolidColor(Color.White),
                                      modifier = Modifier.weight(1f),
                                      decorationBox = { inner ->
                                          if (favSearchQuery.isEmpty()) {
                                              Text("Buscar aplicación...", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp)
                                          }
                                          inner()
                                      }
                                  )
                                  if (favSearchQuery.isNotEmpty()) {
                                      Icon(
                                          imageVector = Icons.Default.Close,
                                          contentDescription = null,
                                          tint = Color.White,
                                          modifier = Modifier
                                              .size(18.dp)
                                              .clickable { favSearchQuery = "" }
                                      )
                                  }
                              }
                          }

                          LazyColumn(
                              modifier = Modifier.weight(1f),
                              contentPadding = PaddingValues(horizontal = 16.dp, vertical = 12.dp),
                              verticalArrangement = Arrangement.spacedBy(4.dp)
                          ) {
                              items(filteredForPicker, key = { "lince_fav_${it.packageName}" }) { app ->
                                  val isChecked = app.packageName in favoritePackages
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clip(RoundedCornerShape(14.dp))
                                          .background(if (isChecked) Color.White.copy(alpha = 0.08f) else Color.Transparent)
                                          .clickable {
                                              val updated = favoritePackages.toMutableSet()
                                              if (isChecked) updated.remove(app.packageName) else updated.add(app.packageName)
                                              favoritePackages = updated
                                              prefs.edit().putStringSet("favorites", updated).apply()
                                              view.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                                          }
                                          .padding(horizontal = 12.dp, vertical = 10.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Checkbox(
                                          checked = isChecked,
                                          onCheckedChange = {
                                              val updated = favoritePackages.toMutableSet()
                                              if (isChecked) updated.remove(app.packageName) else updated.add(app.packageName)
                                              favoritePackages = updated
                                              prefs.edit().putStringSet("favorites", updated).apply()
                                          },
                                          colors = CheckboxDefaults.colors(
                                              checkedColor = accentColor,
                                              uncheckedColor = Color.White.copy(alpha = 0.6f),
                                              checkmarkColor = Color.Black
                                          )
                                      )
                                      Spacer(modifier = Modifier.width(12.dp))
                                      if (app.icon != null) {
                                          Image(
                                              bitmap = app.icon.asImageBitmap(),
                                              contentDescription = null,
                                              modifier = Modifier
                                                  .size(38.dp)
                                                  .clip(RoundedCornerShape(10.dp))
                                          )
                                      }
                                      Spacer(modifier = Modifier.width(14.dp))
                                      Text(
                                          text = app.label,
                                          color = Color.White,
                                          fontSize = 16.sp,
                                          fontWeight = if (isChecked) FontWeight.Bold else FontWeight.Normal,
                                          modifier = Modifier.weight(1f)
                                      )
                                  }
                              }
                          }

                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(Color(0xFF140D0B))
                                  .padding(16.dp)
                          ) {
                              Button(
                                  onClick = {
                                      prefs.edit().putBoolean("first_run_v8", false).apply()
