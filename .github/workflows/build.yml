          val NIAGARA_INDEX: List<Char> = listOf('★') + ('A'..'Z').toList() + listOf('#')

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  setContent {
                      NiagaraFullLauncher()
                  }
              }
          }

          fun expandStatusBar(context: Context) {
              try {
                  val service = context.getSystemService("statusbar")
                  val statusbarManager = Class.forName("android.app.StatusBarManager")
                  val expand = statusbarManager.getMethod("expandNotificationsPanel")
                  expand.invoke(service)
              } catch (_: Exception) {}
          }

          fun getBatteryPercentage(context: Context): Int {
              return try {
                  val intent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = intent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = intent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  if (level >= 0 && scale > 0) (level * 100) / scale else 100
              } catch (_: Exception) {
                  100
              }
          }

          @Composable
          fun NiagaraFullLauncher() {
              val context = LocalContext.current
              val view = LocalView.current
              val density = LocalDensity.current
              val prefs = remember { context.getSharedPreferences("niagara_full_v5_prefs", Context.MODE_PRIVATE) }

              val isFirstRun = remember { prefs.getBoolean("first_run_v5", true) }
              var currentScreen by remember {
                  mutableStateOf(if (isFirstRun) "WELCOME" else "HOME")
              }

              var wallpaperStyle by remember {
                  mutableStateOf(prefs.getString("wallpaper_style", "dark_beach") ?: "dark_beach")
              }
              var customWallpaperBitmap by remember { mutableStateOf<Bitmap?>(null) }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      val customFile = File(context.filesDir, "custom_wallpaper.jpg")
                      if (customFile.exists()) {
                          val bmp = BitmapFactory.decodeFile(customFile.absolutePath)
                          withContext(Dispatchers.Main) {
                              customWallpaperBitmap = bmp
                          }
                      }
                  }
              }

              val galleryLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      try {
                          val inputStream = context.contentResolver.openInputStream(uri)
                          val bmp = BitmapFactory.decodeStream(inputStream)
                          inputStream?.close()
                          if (bmp != null) {
                              customWallpaperBitmap = bmp
                              wallpaperStyle = "custom_gallery"
                              prefs.edit().putString("wallpaper_style", "custom_gallery").apply()
                              val outFile = File(context.filesDir, "custom_wallpaper.jpg")
                              FileOutputStream(outFile).use { out ->
                                  bmp.compress(Bitmap.CompressFormat.JPEG, 90, out)
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              var iconPackMode by remember {
                  mutableStateOf(prefs.getString("icon_pack", "white_minimal") ?: "white_minimal")
              }
              var textColorMode by remember {
                  mutableStateOf(prefs.getString("text_color_mode", "light") ?: "light")
              }
              var fontMode by remember {
                  mutableStateOf(prefs.getString("font_mode", "sans") ?: "sans")
              }
              var clockStyle by remember {
                  mutableStateOf(prefs.getInt("clock_style", 0))
              }
              var showCalendarDate by remember {
                  mutableStateOf(prefs.getBoolean("show_date", false))
              }
              var showWeather by remember {
                  mutableStateOf(prefs.getBoolean("show_weather", false))
              }
              var showBattery by remember {
                  mutableStateOf(prefs.getBoolean("show_battery", false))
              }
              var kwgtStyle by remember {
                  mutableStateOf(prefs.getInt("kwgt_style", 2))
              }
              var hideAlphabet by remember {
                  mutableStateOf(prefs.getBoolean("hide_alphabet", false))
              }
              var hideFavoriteNames by remember {
                  mutableStateOf(prefs.getBoolean("hide_fav_names", false))
              }
              var showNiagaraButton by remember {
                  mutableStateOf(prefs.getBoolean("show_niagara_btn", true))
              }
              var waveOnLeft by remember {
                  mutableStateOf(prefs.getBoolean("wave_left", false))
              }
              var iconSizeDp by remember {
                  mutableStateOf(prefs.getFloat("icon_size", 40f))
              }
              var verticalOffsetDp by remember {
                  mutableStateOf(prefs.getFloat("vertical_offset", 18f))
              }
              var isMovingWidgetMode by remember { mutableStateOf(false) }

              var favoritePackages by remember {
                  val saved = prefs.getStringSet("favorites", null)
                  mutableStateOf(saved?.toSet() ?: emptySet<String>())
              }

              var apps by remember { mutableStateOf<List<AppItem>>(emptyList()) }
              var searchQuery by remember { mutableStateOf("") }
              var favSearchQuery by remember { mutableStateOf("") }
              var isSearching by remember { mutableStateOf(false) }

              var showNiagaraWidgetSheet by remember { mutableStateOf(false) }
              var showClockStylePicker by remember { mutableStateOf(false) }
              var showKwgtPicker by remember { mutableStateOf(false) }
              var selectedAppForMenu by remember { mutableStateOf<AppItem?>(null) }

              var activeChar by remember { mutableStateOf<Char>('★') }
              var activeWaveIndex by remember { mutableStateOf<Int?>(null) }
              var touchY by remember { mutableStateOf<Float?>(null) }
              var containerSize by remember { mutableStateOf(IntSize(1080, 2400)) }

              val listState = rememberLazyListState()

              var currentTime by remember { mutableStateOf("") }
              var currentDateShort by remember { mutableStateOf("") }
              var currentDayName by remember { mutableStateOf("MIÉRCOLES") }
              var currentDayNumber by remember { mutableStateOf("04") }
              var currentWeekNumber by remember { mutableStateOf(45) }
              var batteryLevel by remember { mutableStateOf(100) }
              var hourFloat by remember { mutableStateOf(10f) }
              var minuteFloat by remember { mutableStateOf(10f) }

              LaunchedEffect(Unit) {
                  while (true) {
                      val now = Date()
                      val cal = Calendar.getInstance()
                      currentTime = DateFormat.format("HH:mm", now).toString()
                      currentDateShort = DateFormat.format("EEE, d MMM", now).toString()
                      currentDayName = DateFormat.format("EEEE", now).toString().uppercase()
                      currentDayNumber = DateFormat.format("dd", now).toString()
                      currentWeekNumber = cal.get(Calendar.WEEK_OF_YEAR)
                      hourFloat = (cal.get(Calendar.HOUR) + cal.get(Calendar.MINUTE) / 60f)
                      minuteFloat = cal.get(Calendar.MINUTE).toFloat()
                      batteryLevel = getBatteryPercentage(context)
                      delay(1000L)
                  }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      val pm = context.packageManager
                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }
                      val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
                      val loadedApps = resolveInfos.mapNotNull { ri ->
                          val pkg = ri.activityInfo.packageName
                          if (pkg == context.packageName) return@mapNotNull null
                          val label = ri.loadLabel(pm)?.toString()?.trim() ?: pkg
                          val firstChar = if (label.isNotEmpty()) label[0].uppercaseChar() else '#'
                          val initial = if (firstChar in 'A'..'Z') firstChar else '#'
                          val drawable = ri.loadIcon(pm)
                          AppItem(
                              label = label,
                              packageName = pkg,
                              icon = drawableToBitmap(drawable),
                              initial = initial
                          )
                      }.sortedBy { it.label.lowercase() }

                      withContext(Dispatchers.Main) {
                          apps = loadedApps
                          if (favoritePackages.isEmpty() && loadedApps.isNotEmpty()) {
                              val defaultFavs = loadedApps.take(6).map { it.packageName }.toSet()
