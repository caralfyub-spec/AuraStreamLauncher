name: Compilar APK Directo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Leer archivos
        uses: actions/checkout@v4

      - name: 2. Activar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.5 compatible
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Limpiar conflictos y construir APK
        run: |
          rm -f local.properties settings.gradle.kts build.gradle.kts app/build.gradle.kts

          mkdir -p app/src/main/java/com/atenea/pixelultralauncher
          find . -maxdepth 4 -name "MainActivity.kt" -exec cp {} app/src/main/java/com/atenea/pixelultralauncher/MainActivity.kt \;
          find . -maxdepth 4 -name "AndroidManifest.xml" -exec cp {} app/src/main/AndroidManifest.xml \;

          # Asegurar que el paquete sea com.atenea.pixelultralauncher y quitar iconos/temas que falten
          sed -i 's/^package .*/package com.atenea.pixelultralauncher/' app/src/main/java/com/atenea/pixelultralauncher/MainActivity.kt
          sed -i 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android:theme="[^"]*"/android:theme="@android:style\/Theme.DeviceDefault.NoActionBar"/g' app/src/main/AndroidManifest.xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AuraStream"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.atenea.pixelultralauncher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.atenea.pixelultralauncher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF

          gradle assembleDebug --stacktrace

      - name: 5. Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Aura Stream APK Listo"
          files: app/build/outputs/apk/debug/app-debug.apk
