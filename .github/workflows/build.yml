                          val ch = size.height

                          when (wallpaperStyle) {
                              "dark_beach" -> {
                                  drawRect(color = Color(0xFF050507))
                                  val foamPath = Path().apply {
                                      moveTo(cw * 0.68f, 0f)
                                      var y = 0f
                                      while (y <= ch) {
                                          val waveX = cw * 0.68f + sin(y * 0.012f) * (cw * 0.045f) + cos(y * 0.03f) * (cw * 0.02f)
                                          lineTo(waveX, y)
                                          y += 20f
                                      }
                                      lineTo(cw, ch)
                                      lineTo(cw, 0f)
                                      close()
                                  }
                                  drawPath(
                                      path = foamPath,
                                      brush = Brush.horizontalGradient(
                                          colors = listOf(Color(0xFF1F242D), Color(0xFF0F1318), Color(0xFF282E38)),
                                          startX = cw * 0.65f,
                                          endX = cw
                                      )
                                  )
                                  val shoreLine = Path().apply {
                                      moveTo(cw * 0.68f, 0f)
                                      var y = 0f
                                      while (y <= ch) {
                                          val waveX = cw * 0.68f + sin(y * 0.012f) * (cw * 0.045f) + cos(y * 0.03f) * (cw * 0.02f)
                                          lineTo(waveX, y)
                                          y += 15f
                                      }
                                  }
                                  drawPath(
                                      path = shoreLine,
                                      color = Color.White.copy(alpha = 0.35f),
                                      style = Stroke(width = 3.dp.toPx(), cap = StrokeCap.Round)
                                  )
                              }
                              "split_waves" -> {
                                  val splitX = cw * 0.53f
                                  drawRect(color = Color(0xFFF5F5F4))
                                  drawRect(
                                      color = Color(0xFF1D5B96),
                                      topLeft = Offset(splitX, 0f),
                                      size = androidx.compose.ui.geometry.Size(cw - splitX, ch)
                                  )
                                  val waveCenters = listOf(
                                      Offset(cw * 0.65f, ch * 0.12f),
                                      Offset(cw * 0.88f, ch * 0.25f),
                                      Offset(cw * 0.62f, ch * 0.42f),
                                      Offset(cw * 0.90f, ch * 0.58f),
                                      Offset(cw * 0.66f, ch * 0.74f),
                                      Offset(cw * 0.86f, ch * 0.90f)
                                  )
                                  waveCenters.forEach { center ->
                                      for (r in 5 downTo 1) {
                                          val radius = r * (cw * 0.065f)
                                          drawCircle(
                                              color = if (r % 2 == 0) Color(0xFF0F3C69) else Color(0xFF3882C4),
                                              radius = radius,
                                              center = center
                                          )
                                          drawCircle(
                                              color = Color(0xFFF5F5F4).copy(alpha = 0.85f),
                                              radius = radius,
                                              center = center,
                                              style = Stroke(width = 2.5.dp.toPx())
                                          )
                                      }
                                  }
                                  drawRect(
                                      color = Color(0xFFF5F5F4),
                                      topLeft = Offset(0f, 0f),
                                      size = androidx.compose.ui.geometry.Size(splitX, ch)
                                  )
                              }
                              "oled_black" -> {
                                  drawRect(color = Color(0xFF000000))
                              }
                              "emerald_mist" -> {
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF064E3B), Color(0xFF022C22), Color(0xFF000000))
                                      )
                                  )
                              }
                              "sunset_minimal" -> {
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF7C2D12), Color(0xFF431407), Color(0xFF090D16))
                                      )
                                  )
                              }
                              else -> {
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF7E60BF), Color(0xFF433878), Color(0xFF1E1B4B))
                                      )
                                  )
                              }
                          }
                      }
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(
                              start = if (waveOnLeft) 60.dp else 26.dp,
                              end = if (waveOnLeft) 26.dp else 56.dp,
                              top = 12.dp,
                              bottom = 12.dp
                          )
                  ) {
                      if (isMovingWidgetMode) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(16.dp))
                                  .background(Color(0xEE18191C))
                                  .border(1.dp, accentColor, RoundedCornerShape(16.dp))
                                  .padding(14.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
