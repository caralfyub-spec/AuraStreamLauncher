          fun getBatteryPercentage(context: Context): Int {
              return try {
                  val intent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = intent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = intent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  if (level >= 0 && scale > 0) (level * 100) / scale else 100
              } catch (_: Exception) {
                  100
              }
          }

          // Extrae automáticamente el color vibrante dominante de cualquier icono o imagen importada
          fun extractVibrantColor(bitmap: Bitmap?): Int {
              if (bitmap == null) return 0xFFF59E0B.toInt()
              var bestColor = 0xFFF59E0B.toInt()
              var maxScore = -1f
              val w = bitmap.width
              val h = bitmap.height
              val stepX = (w / 12).coerceAtLeast(1)
              val stepY = (h / 12).coerceAtLeast(1)
              val hsv = FloatArray(3)

              for (x in 0 until w step stepX) {
                  for (y in 0 until h step stepY) {
                      val pixel = bitmap.getPixel(x, y)
                      val alpha = AndroidColor.alpha(pixel)
                      if (alpha < 180) continue
                      AndroidColor.colorToHSV(pixel, hsv)
                      val sat = hsv[1]
                      val value = hsv[2]
                      if (value in 0.25f..0.98f && sat > 0.25f) {
                          val score = sat * 2f + value
                          if (score > maxScore) {
                              maxScore = score
                              bestColor = AndroidColor.HSVToColor(floatArrayOf(hsv[0], sat.coerceAtLeast(0.65f), value.coerceAtLeast(0.85f)))
                          }
                      }
                  }
              }
              return bestColor
          }

          // Lee los iconos reales de un Icon Pack externo (Nova / ADW / Lawnchair) mediante appfilter.xml
          fun loadExternalIconPackMap(pm: PackageManager, iconPackPkg: String): Pair<Resources?, Map<String, String>> {
              val map = mutableMapOf<String, String>()
              return try {
                  val res = pm.getResourcesForApplication(iconPackPkg)
                  var parser: XmlPullParser? = null
                  try {
                      val input = res.assets.open("appfilter.xml")
                      val factory = XmlPullParserFactory.newInstance()
                      parser = factory.newPullParser()
                      parser.setInput(input, "UTF-8")
                  } catch (_: Exception) {
                      val xmlId = res.getIdentifier("appfilter", "xml", iconPackPkg)
                      if (xmlId != 0) {
                          parser = res.getXml(xmlId)
                      }
                  }

                  if (parser != null) {
                      var eventType = parser.eventType
                      while (eventType != XmlPullParser.END_DOCUMENT) {
                          if (eventType == XmlPullParser.START_TAG && parser.name == "item") {
                              val comp = parser.getAttributeValue(null, "component")
                              val drawableName = parser.getAttributeValue(null, "drawable")
                              if (!comp.isNullOrBlank() && !drawableName.isNullOrBlank()) {
                                  val pkgPart = comp.substringAfter("{", "").substringBefore("/", "")
                                  if (pkgPart.isNotEmpty()) {
                                      map[pkgPart] = drawableName
                                  }
                              }
                          }
                          eventType = parser.next()
                      }
                  }
                  Pair(res, map)
              } catch (_: Exception) {
                  Pair(null, emptyMap())
              }
          }

