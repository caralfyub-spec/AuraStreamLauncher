                  modifier = Modifier
                      .fillMaxSize()
                      .onSizeChanged { containerSize = it }
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onLongPress = {
                                  view.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                  showLinceWidgetSheet = true
                              },
                              onTap = {
                                  if (isMovingWidgetMode) isMovingWidgetMode = false
                              }
                          )
                      }
                      .pointerInput(Unit) {
                          var totalDy = 0f
                          detectVerticalDragGestures(
                              onDragStart = { totalDy = 0f },
                              onVerticalDrag = { _, dragAmount -> totalDy += dragAmount },
                              onDragEnd = {
                                  if (totalDy < -90f && !isSearching) {
                                      isSearching = true
                                  } else if (totalDy > 90f && !isSearching) {
                                      expandStatusBar(context)
                                  }
                              }
                          )
                      }
              ) {
                  // 1. RENDERIZADO DE FONDOS DE PANTALLA (EGIPTO + LINCE IBÉRICO + GALERÍA)
                  if (wallpaperStyle == "custom_gallery" && customWallpaperBitmap != null) {
                      Image(
                          bitmap = customWallpaperBitmap!!.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          val cw = size.width
                          val ch = size.height

                          when (wallpaperStyle) {
                              "nilo_piramides" -> {
                                  drawEgyptianNileWallpaper(this, cw, ch, isNight = false)
                              }
                              "noche_faraonica" -> {
                                  drawEgyptianNileWallpaper(this, cw, ch, isNight = true)
                              }
                              "sierra_andujar" -> {
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF0F1713), Color(0xFF0B0D0C))
                                      )
                                  )
                                  val pinePath = Path().apply {
                                      moveTo(0f, ch * 0.7f)
                                      for (x in 0..(cw.toInt()) step 40) {
                                          lineTo(x.toFloat(), ch * 0.72f - (sin(x * 0.05f) * 15f) - (cos(x * 0.012f) * 40f))
                                          lineTo(x.toFloat() + 15, ch * 0.65f - (sin(x * 0.03f) * 30f))
                                          lineTo(x.toFloat() + 30, ch * 0.72f)
                                      }
                                      lineTo(cw, ch)
                                      lineTo(0f, ch)
                                      close()
                                  }
                                  drawPath(pinePath, Color(0xFF1E2E21).copy(alpha = 0.5f))
                                  drawLinceSilhouette(this, Offset(cw * 0.62f, ch * 0.64f), cw * 0.32f, Color(0xFF0E130F))
                              }
                              "ocaso_donana" -> {
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF7C2D12), Color(0xFF3F1A0A), Color(0xFF140B07))
                                      )
                                  )
                                  drawCircle(
                                      brush = Brush.radialGradient(
                                          colors = listOf(Color(0xFFFEF08A), Color(0xFFF97316).copy(alpha = 0.1f)),
                                          center = Offset(cw * 0.35f, ch * 0.55f),
                                          radius = 180f
                                      ),
                                      center = Offset(cw * 0.35f, ch * 0.55f),
                                      radius = 180f
                                  )
                                  val foliagePath = Path().apply {
                                      moveTo(0f, ch * 0.75f)
                                      for (x in 0..(cw.toInt()) step 20) {
                                          lineTo(x.toFloat(), ch * 0.78f - (abs(sin(x * 0.04f)) * 40f))
                                      }
                                      lineTo(cw, ch)
                                      lineTo(0f, ch)
                                      close()
                                  }
                                  drawPath(foliagePath, Color(0xFF1F0D05))
                                  drawLinceSilhouette(this, Offset(cw * 0.55f, ch * 0.68f), cw * 0.4f, Color(0xFF0A0402))
                              }
                              "mirada_oled" -> {
                                  drawRect(color = Color(0xFF000000))
                                  val leftEye = Offset(cw * 0.62f, ch * 0.35f)
                                  val rightEye = Offset(cw * 0.78f, ch * 0.35f)
                                  drawCircle(accentColor.copy(alpha = 0.7f), radius = 16f, center = leftEye)
                                  drawCircle(accentColor.copy(alpha = 0.7f), radius = 16f, center = rightEye)
                                  drawCircle(Color.Black, radius = 4f, center = leftEye)
                                  drawCircle(Color.Black, radius = 4f, center = rightEye)
                                  drawLine(Color.White.copy(alpha = 0.2f), leftEye + Offset(-15f, -10f), leftEye + Offset(-40f, -80f), strokeWidth = 3f)
                                  drawLine(Color.White.copy(alpha = 0.2f), rightEye + Offset(15f, -10f), rightEye + Offset(40f, -80f), strokeWidth = 3f)
                              }
                              else -> {
                                  drawRect(
                                      brush = Brush.verticalGradient(
                                          colors = listOf(Color(0xFF0A0F1D), Color(0xFF020408))
                                      )
                                  )
                              }
                          }
                      }
                  }

                  // 2. CAPA DE INTERFAZ Y RELOJES (EGIPCIOS Y LINCE)
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(
                              start = if (waveOnLeft) 60.dp else 26.dp,
                              end = if (waveOnLeft) 26.dp else 56.dp,
                              top = 12.dp,
                              bottom = 12.dp
                          )
                  ) {
                      if (isMovingWidgetMode) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(16.dp))
                                  .background(Color(0xEE1E1412))
                                  .border(1.dp, accentColor, RoundedCornerShape(16.dp))
                                  .padding(14.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("↕ Arrastra para mover el reloj y las apps", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                  TextButton(onClick = { isMovingWidgetMode = false }) {
                                      Text("Hecho", color = accentColor, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Slider(
                                  value = verticalOffsetDp,
                                  onValueChange = {
                                      verticalOffsetDp = it
                                      prefs.edit().putFloat("vertical_offset", it).apply()
                                  },
                                  valueRange = 0f..200f,
                                  colors = SliderDefaults.colors(thumbColor = accentColor, activeTrackColor = accentColor)
                              )
                          }
                          Spacer(modifier = Modifier.height(8.dp))
                      }

                      Spacer(modifier = Modifier.height(verticalOffsetDp.dp))

                      // RELOJES EXCLUSIVOS (LINCE IBÉRICO Y ANTIGUO EGIPTO)
                      if (linceClockStyle > 0 && !isSearching && activeChar == '★') {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(bottom = 18.dp)
                                  .pointerInput(Unit) {
                                      detectTapGestures(
                                          onTap = { showLinceClockPicker = true },
                                          onLongPress = { showLinceWidgetSheet = true }
                                      )
                                  },
                              contentAlignment = Alignment.CenterStart
                          ) {
                              when (linceClockStyle) {
                                  1 -> {
                                      // RELOJ 1: OREJAS DE LINCE
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Canvas(modifier = Modifier.size(126.dp)) {
                                              val center = Offset(size.width / 2f, size.height / 2f)
                                              val r = size.width / 2f
                                              drawCircle(Color.White.copy(alpha = 0.08f), radius = r)
                                              drawCircle(accentColor.copy(alpha = 0.4f), radius = r, style = Stroke(width = 2.dp.toPx()))

                                              val earsBg = Path().apply {
                                                  moveTo(center.x - 30f, center.y - 10f)
                                                  lineTo(center.x - 50f, center.y - r * 0.85f)
                                                  lineTo(center.x - 10f, center.y - 20f)
                                                  moveTo(center.x + 30f, center.y - 10f)
                                                  lineTo(center.x + 50f, center.y - r * 0.85f)
                                                  lineTo(center.x + 10f, center.y - 20f)
                                              }
                                              drawPath(earsBg, accentColor.copy(alpha = 0.25f), style = Stroke(width = 1.5.dp.toPx()))

                                              drawCircle(accentColor, radius = 4f, center = Offset(center.x, center.y - r + 15f))
                                              drawCircle(accentColor, radius = 4f, center = Offset(center.x + r - 15f, center.y))
                                              drawCircle(accentColor, radius = 4f, center = Offset(center.x, center.y + r - 15f))
                                              drawCircle(accentColor, radius = 4f, center = Offset(center.x - r + 15f, center.y))

                                              val hAngle = ((hourFloat % 12f) * 30f - 90f) * (PI.toFloat() / 180f)
                                              val hrLength = r * 0.48f
                                              val hEnd = Offset(center.x + cos(hAngle) * hrLength, center.y + sin(hAngle) * hrLength)
                                              drawLine(accentColor, start = center, end = hEnd, strokeWidth = 3.5.dp.toPx(), cap = StrokeCap.Round)
                                              drawCircle(Color.Black, radius = 4f, center = hEnd)

                                              val mAngle = (minuteFloat * 6f - 90f) * (PI.toFloat() / 180f)
                                              val mLength = r * 0.72f
                                              val mEnd = Offset(center.x + cos(mAngle) * mLength, center.y + sin(mAngle) * mLength)
                                              drawLine(Color.White, start = center, end = mEnd, strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round)
                                              drawLine(Color.Black, mEnd, mEnd + Offset(cos(mAngle + 0.5f) * 12f, sin(mAngle + 0.5f) * 12f), strokeWidth = 2f)
                                              drawLine(Color.Black, mEnd, mEnd + Offset(cos(mAngle - 0.5f) * 12f, sin(mAngle - 0.5f) * 12f), strokeWidth = 2f)

                                              drawCircle(Color.Black, radius = 5.dp.toPx(), center = center)
                                              drawCircle(accentColor, radius = 2.dp.toPx(), center = center)
                                          }
                                          Spacer(modifier = Modifier.height(8.dp))
                                          Text(
                                              text = "ACECHANDO: $currentTime",
                                              color = primaryTextColor,
                                              fontSize = 13.sp,
                                              fontWeight = FontWeight.Bold,
                                              letterSpacing = 2.sp
                                          )
                                      }
                                  }
                                  2 -> {
                                      // RELOJ 2: HUELLA SALVAJE
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Box(
                                              modifier = Modifier.size(110.dp),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Canvas(modifier = Modifier.fillMaxSize()) {
                                                  val scale = size.width / 110f
                                                  val heel = Path().apply {
                                                      moveTo(40f * scale, 55f * scale)
                                                      quadraticBezierTo(20f * scale, 75f * scale, 35f * scale, 95f * scale)
                                                      quadraticBezierTo(55f * scale, 85f * scale, 75f * scale, 95f * scale)
                                                      quadraticBezierTo(90f * scale, 75f * scale, 70f * scale, 55f * scale)
                                                      quadraticBezierTo(55f * scale, 65f * scale, 40f * scale, 55f * scale)
                                                      close()
                                                  }
                                                  drawPath(heel, Color(0xFFF59E0B).copy(alpha = 0.14f))
                                                  drawPath(heel, accentColor.copy(alpha = 0.5f), style = Stroke(width = 2.dp.toPx()))

                                                  val deditos = listOf(
                                                      Offset(23f, 38f),
                                                      Offset(42f, 25f),
                                                      Offset(68f, 25f),
                                                      Offset(87f, 38f)
                                                  )
                                                  deditos.forEach { pt ->
                                                      drawCircle(accentColor.copy(alpha = 0.5f), radius = 10f * scale, center = pt * scale)
                                                      drawLine(Color.White.copy(alpha = 0.4f), pt * scale, (pt + Offset(0f, -14f)) * scale, strokeWidth = 2.5f)
                                                  }
                                              }
                                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                                  Text(
                                                      text = currentTime,
                                                      color = Color.White,
                                                      fontSize = 24.sp,
                                                      fontWeight = FontWeight.Bold
                                                  )
                                                  Text(
                                                      text = "BATERÍA: $batteryLevel%",
                                                      color = accentColor,
                                                      fontSize = 8.sp,
                                                      fontWeight = FontWeight.SemiBold
                                                  )
                                              }
                                          }
                                      }
                                  }
                                  3 -> {
                                      // RELOJ 3: MIRADA SALVAJE DOÑANA
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(12.dp))
                                                  .background(accentColor)
                                                  .padding(horizontal = 14.dp, vertical = 6.dp)
                                          ) {
                                              Text(
                                                  text = currentDayNumber,
                                                  color = Color.Black,
                                                  fontSize = 22.sp,
                                                  fontWeight = FontWeight.ExtraBold
                                              )
                                          }
                                          Spacer(modifier = Modifier.width(14.dp))
                                          Column {
                                              Text(
                                                  text = "$currentDayName • TERRITORIO LINCE",
                                                  color = accentColor,
                                                  fontSize = 11.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  letterSpacing = 1.sp
                                              )
                                              Text(
                                                  text = currentTime,
                                                  color = Color.White,
                                                  fontSize = 32.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  fontFamily = appFontFamily
                                              )
                                              Text(
                                                  text = "Sierra y Monte • ☀ 18°C • 🔋 $batteryLevel%",
                                                  color = secondaryTextColor,
                                                  fontSize = 11.sp
                                              )
                                          }
                                      }
                                  }
                                  4 -> {
                                      // RELOJ 4: RELOJ SOLAR EGIPCIO DE RA Y OJO DE HORUS
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text(
                                              text = "☥  SOL DE RA • VALLE DEL NILO  ☥",
                                              color = Color(0xFFFFD700),
                                              fontSize = 10.sp,
                                              fontWeight = FontWeight.Bold,
                                              letterSpacing = 2.sp
                                          )
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Canvas(modifier = Modifier.size(134.dp)) {
                                              val center = Offset(size.width / 2f, size.height / 2f)
                                              val r = size.width / 2f

                                              // Halo solar exterior
                                              drawCircle(
                                                  brush = Brush.radialGradient(
                                                      colors = listOf(Color(0xFF1E293B).copy(alpha = 0.85f), Color(0xFF090D16).copy(alpha = 0.92f)),
                                                      center = center,
                                                      radius = r
                                                  ),
                                                  radius = r,
                                                  center = center
                                              )
                                              // Doble anillo real de oro y turquesa egipcio
                                              drawCircle(Color(0xFFFFD700), radius = r, style = Stroke(width = 2.8.dp.toPx()))
                                              drawCircle(Color(0xFF2DD4BF).copy(alpha = 0.7f), radius = r * 0.91f, style = Stroke(width = 1.2.dp.toPx()))

                                              // 12 Rayos / Marcas jeroglíficas solares
                                              for (m in 0 until 12) {
                                                  val ang = (m * 30.0 - 90.0) * (PI / 180.0)
                                                  val p1 = Offset(
                                                      (center.x + cos(ang) * (r * 0.78f)).toFloat(),
                                                      (center.y + sin(ang) * (r * 0.78f)).toFloat()
                                                  )
                                                  val p2 = Offset(
                                                      (center.x + cos(ang) * (r * 0.89f)).toFloat(),
                                                      (center.y + sin(ang) * (r * 0.89f)).toFloat()
                                                  )
                                                  drawLine(
                                                      color = if (m % 3 == 0) Color(0xFFFFD700) else Color(0xFFFDE047).copy(alpha = 0.55f),
                                                      start = p1,
                                                      end = p2,
                                                      strokeWidth = if (m % 3 == 0) 3.dp.toPx() else 1.5.dp.toPx()
                                                  )
                                              }

                                              // Pequeña pirámide dorada y Ojo de Horus estilizado en el centro
                                              val innerPyr = Path().apply {
                                                  moveTo(center.x, center.y - r * 0.36f)
                                                  lineTo(center.x - r * 0.36f, center.y + r * 0.25f)
                                                  lineTo(center.x + r * 0.36f, center.y + r * 0.25f)
                                                  close()
                                              }
                                              drawPath(innerPyr, Color(0xFFFFD700).copy(alpha = 0.16f))
                                              drawPath(innerPyr, Color(0xFFFFD700).copy(alpha = 0.45f), style = Stroke(width = 1.2.dp.toPx()))

                                              // Ojo de Horus (Udjat) en el corazón de la pirámide
                                              val eyeArc = Path().apply {
                                                  moveTo(center.x - 18f, center.y)
                                                  quadraticBezierTo(center.x, center.y - 12f, center.x + 18f, center.y)
                                                  quadraticBezierTo(center.x, center.y + 12f, center.x - 18f, center.y)
                                                  close()
                                              }
                                              drawPath(eyeArc, Color(0xFF2DD4BF).copy(alpha = 0.45f))
                                              drawPath(eyeArc, Color(0xFFFFD700), style = Stroke(width = 1.5.dp.toPx()))
                                              // Lágrima y espiral de Horus
                                              drawLine(Color(0xFFFFD700), Offset(center.x, center.y + 6f), Offset(center.x, center.y + 20f), strokeWidth = 2f)
                                              drawLine(Color(0xFFFFD700), Offset(center.x + 6f, center.y + 4f), Offset(center.x + 18f, center.y + 16f), strokeWidth = 2f)

                                              // Aguja Horaria (Cetro Real Dorado)
                                              val hAngle = ((hourFloat % 12f) * 30f - 90f) * (PI.toFloat() / 180f)
                                              val hEnd = Offset(center.x + cos(hAngle) * (r * 0.50f), center.y + sin(hAngle) * (r * 0.50f))
                                              drawLine(Color(0xFFFFD700), start = center, end = hEnd, strokeWidth = 4.dp.toPx(), cap = StrokeCap.Round)

                                              // Aguja Minutera (Obelisco Turquesa y Oro)
                                              val mAngle = (minuteFloat * 6f - 90f) * (PI.toFloat() / 180f)
                                              val mEnd = Offset(center.x + cos(mAngle) * (r * 0.72f), center.y + sin(mAngle) * (r * 0.72f))
                                              drawLine(Color(0xFFFEF08A), start = center, end = mEnd, strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round)

                                              // Disco Solar central
                                              drawCircle(Color(0xFFB45309), radius = 6.dp.toPx(), center = center)
                                              drawCircle(Color(0xFFFFD700), radius = 3.5.dp.toPx(), center = center)
                                          }
                                          Spacer(modifier = Modifier.height(8.dp))
                                          // Cartucho inferior con hora digital y clima del Nilo
                                          Box(
                                              modifier = Modifier
                                                  .clip(RoundedCornerShape(20.dp))
                                                  .background(Color(0xCC111827))
                                                  .border(1.2.dp, Color(0xFFFFD700), RoundedCornerShape(20.dp))
                                                  .padding(horizontal = 16.dp, vertical = 5.dp)
                                          ) {
                                              Text(
                                                  text = "▲ $currentTime  •  $currentDateShort  •  🔋 $batteryLevel%",
                                                  color = Color(0xFFFEF08A),
                                                  fontSize = 11.sp,
                                                  fontWeight = FontWeight.Bold
                                              )
                                          }
                                      }
                                  }
                                  5 -> {
                                      // RELOJ 5: CARTUCHO REAL FARAÓNICO (DIGITAL JEROGLÍFICO)
                                      Column(
                                          modifier = Modifier
                                              .width(230.dp)
                                              .clip(RoundedCornerShape(26.dp))
                                              .background(
                                                  Brush.verticalGradient(
                                                      colors = listOf(Color(0xDD1E293B), Color(0xEE0F172A))
                                                  )
                                              )
                                              .border(2.dp, Color(0xFFFFD700), RoundedCornerShape(26.dp))
                                              .padding(horizontal = 18.dp, vertical = 14.dp),
                                          horizontalAlignment = Alignment.CenterHorizontally
                                      ) {
                                          Text(
                                              text = "☥  𓂀  ▲  DINASTÍA DEL NILO  ▲  𓂀  ☥",
                                              color = Color(0xFFFFD700),
                                              fontSize = 9.sp,
                                              fontWeight = FontWeight.Bold,
                                              letterSpacing = 1.5.sp
                                          )
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Text(
                                              text = currentTime,
                                              color = Color(0xFFFEF9C3),
                                              fontSize = 44.sp,
                                              fontWeight = FontWeight.ExtraBold,
                                              fontFamily = FontFamily.Serif,
                                              letterSpacing = 2.sp
                                          )
                                          Text(
                                              text = "$currentDayName, $currentDayNumber  •  EL CAIRO / GIZA",
                                              color = Color(0xFF2DD4BF),
                                              fontSize = 10.sp,
                                              fontWeight = FontWeight.Bold,
                                              letterSpacing = 1.sp
                                          )
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Box(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(2.dp)
                                                  .background(Color(0xFFFFD700).copy(alpha = 0.5f))
                                          )
                                          Spacer(modifier = Modifier.height(6.dp))
                                          Text(
                                              text = "☀ Cielo despejado en el Nilo • Energía de Ra: $batteryLevel%",
                                              color = Color(0xFFFDE047).copy(alpha = 0.85f),
                                              fontSize = 10.sp
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      // Reloj clásico alternativo
                      if (clockStyle > 0) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clickable { showLinceWidgetSheet = true }
                                  .padding(bottom = 12.dp)
                          ) {
                              Text(
                                  text = currentTime,
                                  color = primaryTextColor,
                                  fontSize = 54.sp,
                                  fontWeight = FontWeight.Bold,
                                  fontFamily = appFontFamily,
                                  letterSpacing = (-1.5).sp
                              )
                              if (showCalendarDate) {
                                  Text(
                                      text = "$currentDateShort  •  🔋 $batteryLevel%",
                                      color = secondaryTextColor,
                                      fontSize = 14.sp,
                                      fontWeight = FontWeight.Medium
                                  )
                              }
                          }
                      }

                      // BUSCADOR DESLIZABLE
                      if (isSearching) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(28.dp))
                                  .background(Color(0xEEFFFFFF))
                                  .padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(
                                  imageVector = Icons.Default.Search,
                                  contentDescription = null,
                                  tint = Color(0xFF111827),
                                  modifier = Modifier.size(20.dp)
                              )
                              Spacer(modifier = Modifier.width(10.dp))
                              BasicTextField(
                                  value = searchQuery,
                                  onValueChange = { searchQuery = it },
                                  singleLine = true,
                                  textStyle = TextStyle(color = Color(0xFF111827), fontSize = 16.sp),
                                  cursorBrush = SolidColor(accentColor),
                                  modifier = Modifier.weight(1f),
                                  decorationBox = { innerTextField ->
                                      if (searchQuery.isEmpty()) {
                                          Text(
                                              text = "Buscar aplicaciones...",
                                              color = Color(0xFF6B7280),
                                              fontSize = 15.sp
                                          )
                                      }
                                      innerTextField()
                                  }
                              )
                              IconButton(
                                  onClick = {
                                      searchQuery = ""
                                      isSearching = false
                                  },
                                  modifier = Modifier.size(22.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.Close,
                                      contentDescription = null,
                                      tint = Color(0xFF374151)
                                  )
                              }
                          }
                          Spacer(modifier = Modifier.height(12.dp))
                      }

                      // CABECERA CUANDO HAY UNA LETRA FIJADA EN PANTALLA
                      if (!isSearching && activeChar != '★') {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier
                                  .padding(bottom = 8.dp)
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(Color.Black.copy(alpha = 0.45f))
                                  .border(1.dp, accentColor.copy(alpha = 0.6f), RoundedCornerShape(12.dp))
                                  .padding(horizontal = 12.dp, vertical = 6.dp)
                          ) {
                              Text(
                                  text = "Letra: $activeChar",
                                  color = primaryTextColor,
                                  fontSize = 15.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Spacer(modifier = Modifier.width(12.dp))
                              TextButton(
                                  onClick = {
                                      activeChar = '★'
                                      activeWaveIndex = null
                                  },
                                  contentPadding = PaddingValues(0.dp)
                              ) {
                                  Text("★ Volver a Favoritos", color = accentColor, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }

                      // LISTA DE APLICACIONES + BOTONES RÁPIDOS AL FINAL
                      LazyColumn(
                          state = listState,
                          modifier = Modifier.fillMaxSize(),
                          verticalArrangement = Arrangement.spacedBy(2.dp),
                          contentPadding = PaddingValues(bottom = 90.dp)
                      ) {
                          items(displayedApps.size) { i ->
                              val app = displayedApps[i]
                              val arcOffsetDp = if (touchY != null) {
                                  val normalized = (i - displayedApps.size / 2f) / (displayedApps.size.coerceAtLeast(1) / 2f)
                                  val curve = (1f - (normalized * normalized).coerceIn(0f, 1f)) * 34f
                                  if (waveOnLeft) curve else -curve
                              } else {
                                  0f
                              }

                              LinceAppRow(
                                  app = app,
                                  textColor = primaryTextColor,
                                  fontFamily = appFontFamily,
                                  iconPackMode = iconPackMode,
                                  iconSizeDp = iconSizeDp,
                                  hideName = hideFavoriteNames && activeChar == '★' && !isSearching,
                                  horizontalShiftDp = arcOffsetDp,
                                  onClick = { launchApp(context, app.packageName) },
                                  onLongClick = { selectedAppForMenu = app }
                              )
                          }

                          item(key = "lince_footer") {
                              Spacer(modifier = Modifier.height(22.dp))
                              Row(
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(Color.Black.copy(alpha = 0.45f))
                                          .border(1.dp, accentColor.copy(alpha = 0.5f), RoundedCornerShape(20.dp))
                                          .clickable { currentScreen = "THEMES" }
                                          .padding(horizontal = 12.dp, vertical = 8.dp)
                                  ) {
                                      Text(
                                          text = "☥ Temas Egipto/Lince",
                                          color = accentColor,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(Color.Black.copy(alpha = 0.45f))
                                          .border(1.dp, primaryTextColor.copy(alpha = 0.35f), RoundedCornerShape(20.dp))
                                          .clickable { currentScreen = "FAVORITES" }
                                          .padding(horizontal = 12.dp, vertical = 8.dp)
                                  ) {
                                      Text(
                                          text = "★ Favoritos",
                                          color = primaryTextColor,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(Color.Black.copy(alpha = 0.45f))
                                          .border(1.dp, primaryTextColor.copy(alpha = 0.35f), RoundedCornerShape(20.dp))
                                          .clickable { currentScreen = "SETTINGS" }
