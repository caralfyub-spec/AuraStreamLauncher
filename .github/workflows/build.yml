name: Compilar APK Directo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Leer archivos
        uses: actions/checkout@v4

      - name: 2. Activar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Construir Lince Luminoso, Niagara y Egipto v9.0
        run: |
          rm -rf app build .gradle local.properties settings.gradle* build.gradle* gradle.properties MainActivity.kt
          mkdir -p app/src/main/java/com/atenea/pixelultralauncher

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          sed -i 's/^[[:space:]]*//' gradle.properties

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LinceIbericoLauncher"
          include(":app")
          EOF
          sed -i 's/^          //' settings.gradle.kts

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          sed -i 's/^          //' build.gradle.kts

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.atenea.pixelultralauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.atenea.pixelultralauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 9
                  versionName = "9.0-LinceClaro-Niagara-Colores"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          EOF
          sed -i 's/^          //' app/build.gradle.kts

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.EXPAND_STATUS_BAR" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Lince Ibérico"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          sed -i 's/^          //' app/src/main/AndroidManifest.xml

          cat << 'EOF' > app/src/main/java/com/atenea/pixelultralauncher/MainActivity.kt
          package com.atenea.pixelultralauncher

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas as AndroidCanvas
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Bundle
          import android.provider.Settings
          import android.text.format.DateFormat
          import android.view.HapticFeedbackConstants
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.gestures.detectVerticalDragGestures
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.DrawScope
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalView
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.IntSize
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.view.WindowCompat
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.util.Calendar
          import java.util.Date
          import kotlin.math.*

          data class AppItem(val label: String, val packageName: String, val icon: Bitmap?, val initial: Char)
          data class ThemePreset(
              val id: String,
              val title: String,
              val subtitle: String,
              val wallpaper: String,
              val iconPack: String,
              val textColor: String,
              val clockType: Int,
              val waveColor: String,
              val hideAlphabet: Boolean,
              val previewColor: Color
          )

          val ALL_THEME_PRESETS = listOf(
              // 1. TEMAS SUPER LUMINOSOS Y CLAROS DEL LINCE IBÉRICO
              ThemePreset("lince_dia_claro", "🐾 Lince al Sol de Sierra Morena (Claro y Vivo)", "Cielo celeste luminoso • Lince ocre y blanco detallado • Barra Arcoíris", "lince_sol_claro", "black_essence", "dark", 1, "rainbow", false, Color(0xFFF59E0B)),
              ThemePreset("lince_donana_claro", "🐾 Brisa Clara de Doñana (Arena y Turquesa)", "Fondo marisma turquesa y arena blanca • Lince iluminado • Barra Esmeralda", "lince_marisma_clara", "black_essence", "dark", 2, "emerald", false, Color(0xFF10B981)),
              ThemePreset("lince_tarde_dorada", "🐾 Tarde Dorada en la Dehesa (Miel y Sol)", "Luz dorada cálida • Lince ibérico vivo • Barra Fuego Solar", "lince_miel_dorada", "white_minimal", "light", 1, "fire", false, Color(0xFFEA580C)),
              // 2. TODOS LOS TEMAS DE NIAGARA LAUNCHER (ORIGINALES + VÍDEO)
              ThemePreset("niagara_waves", "🌊 Niagara Olas Japonesas (Diseño 2 Vídeo)", "Mitad blanco marfil y olas azules • Iconos negros • Widget 15", "split_waves", "black_essence", "dark", 8, "ocean", false, Color(0xFF0284C7)),
              ThemePreset("niagara_beach", "🌊 Niagara Costa Arena (Diseño 1 Vídeo)", "Orilla espumosa y negro • Iconos blancos • Reloj Analógico Blanco", "dark_beach", "white_minimal", "light", 7, "cyan", false, Color(0xFF38BDF8)),
              ThemePreset("niagara_gold_intro", "🌊 Niagara Intro Cartel Dorado", "Fondo costa • Marco [ M A R T E S ] • Barra Oro", "dark_beach", "white_minimal", "light", 6, "gold", false, Color(0xFFD4AF37)),
              ThemePreset("niagara_left_intro", "🌊 Niagara Intro Semana 05 (Móvil Izquierdo)", "Mitad blanco/olas • Widget 05 con barra de semana • Letras Azules", "split_waves", "black_essence", "dark", 3, "cyan", false, Color(0xFF0EA5E9)),
              ThemePreset("niagara_purple", "🌊 Niagara Original Cristal Morado", "Degradado oficial Niagara • Iconos originales • Barra Rosa Neón", "purple_swirl", "default", "light", 9, "magenta", false, Color(0xFF8B5CF6)),
              ThemePreset("niagara_emerald", "🌊 Niagara Bosque Esmeralda Claro", "Degradado verde menta y esmeralda • Iconos blancos • Barra Esmeralda", "emerald_mist", "white_minimal", "light", 9, "emerald", false, Color(0xFF10B981)),
              // 3. TEMAS DE EGIPTO, EL NILO Y LAS PIRÁMIDES
              ThemePreset("egipto_nilo", "☥ Sol en el Nilo y Pirámides (Egipto Claro)", "Pirámides doradas 3D y Río Nilo azul • Reloj Solar de Ra • Barra Oro", "nilo_piramides", "gold_pharaoh", "light", 4, "gold", false, Color(0xFFFFD700)),
              ThemePreset("egipto_noche", "▲ Noche Faraónica en Luxor (Egipto)", "Cielo lapislázuli estrellado • Cartucho Real • Barra Cian", "noche_faraonica", "white_minimal", "light", 5, "cyan", false, Color(0xFF2563EB))
          )

          val RAINBOW_PALETTE = listOf(
              Color(0xFFFF1744), Color(0xFFFF5252), Color(0xFFFF9100), Color(0xFFFFCA28),
              Color(0xFFFFEA00), Color(0xFF76FF03), Color(0xFF00E676), Color(0xFF1DE9B6),
              Color(0xFF00E5FF), Color(0xFF00B0FF), Color(0xFF2979FF), Color(0xFF651FFF),
              Color(0xFFD500F9), Color(0xFFFF4081)
          )

          val FIRE_PALETTE = listOf(
              Color(0xFFFFF59D), Color(0xFFFFEE58), Color(0xFFFFCA28), Color(0xFFFFB300),
              Color(0xFFFF8F00), Color(0xFFF57C00), Color(0xFFE65100), Color(0xFFFF3D00), Color(0xFFDD2C00)
          )

          val OCEAN_PALETTE = listOf(
              Color(0xFF84FFFF), Color(0xFF18FFFF), Color(0xFF00E5FF), Color(0xFF00B0FF),
              Color(0xFF40C4FF), Color(0xFF0091EA), Color(0xFF2962FF), Color(0xFF1DE9B6)
          )

          val WAVE_COLOR_OPTIONS = listOf(
              Triple("rainbow", "🌈 Arcoíris Multicolor (Cada letra un color)", Color(0xFF00E5FF)),
              Triple("fire", "🔥 Degradado Fuego Solar (Amarillo a Rojo)", Color(0xFFFF9100)),
              Triple("ocean", "🌊 Degradado Océano Turquesa (Cian a Azul)", Color(0xFF00B0FF)),
              Triple("gold", "🟡 Oro Real Brillante", Color(0xFFFFD700)),
              Triple("cyan", "🔵 Cian Neón Eléctrico", Color(0xFF00E5FF)),
              Triple("emerald", "🟢 Verde Esmeralda Vivo", Color(0xFF00E676)),
              Triple("lynx_amber", "🟠 Naranja Ámbar Lince", Color(0xFFFF6D00)),
              Triple("magenta", "🟣 Rosa Neón / Fucsia", Color(0xFFFF4081)),
              Triple("purple", "🟣 Violeta Brillante", Color(0xFFB388FF)),
              Triple("red", "🔴 Rojo Coral Intenso", Color(0xFFFF1744)),
              Triple("white", "⚪ Blanco Puro", Color(0xFFFFFFFF)),
              Triple("black", "⚫ Negro Intenso (Para fondos claros)", Color(0xFF111827))
          )

          val LINCE_INDEX: List<Char> = listOf('★') + ('A'..'Z').toList() + listOf('#')

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  setContent { LinceIbericoLauncher() }
              }
          }

          fun expandStatusBar(context: Context) {
              try {
                  val service = context.getSystemService("statusbar")
                  Class.forName("android.app.StatusBarManager").getMethod("expandNotificationsPanel").invoke(service)
              } catch (_: Exception) {}
          }

          fun getBatteryPercentage(context: Context): Int {
              return try {
                  val intent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = intent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = intent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  if (level >= 0 && scale > 0) (level * 100) / scale else 100
              } catch (_: Exception) { 100 }
          }

          fun getWaveLetterColor(index: Int, mode: String, fallback: Color): Color {
              return when (mode) {
                  "rainbow" -> RAINBOW_PALETTE[index % RAINBOW_PALETTE.size]
                  "fire" -> FIRE_PALETTE[index % FIRE_PALETTE.size]
                  "ocean" -> OCEAN_PALETTE[index % OCEAN_PALETTE.size]
                  "gold" -> Color(0xFFFFD700)
                  "cyan" -> Color(0xFF00E5FF)
                  "emerald" -> Color(0xFF00E676)
                  "lynx_amber" -> Color(0xFFFF6D00)
                  "magenta" -> Color(0xFFFF4081)
                  "purple" -> Color(0xFFB388FF)
                  "red" -> Color(0xFFFF1744)
                  "white" -> Color.White
                  "black" -> Color(0xFF111827)
                  else -> fallback
              }
          }

          @Composable
          fun LinceIbericoLauncher() {
              val context = LocalContext.current
              val view = LocalView.current
              val density = LocalDensity.current
              val prefs = remember { context.getSharedPreferences("lince_v9_prefs", Context.MODE_PRIVATE) }

              var currentScreen by remember { mutableStateOf(if (prefs.getBoolean("first_v9", true)) "WELCOME" else "HOME") }
              // Arranca por defecto con el nuevo tema claro y soleado del Lince Ibérico
              var wallpaperStyle by remember { mutableStateOf(prefs.getString("wallpaper_style", "lince_sol_claro") ?: "lince_sol_claro") }
              var customWallpaperBitmap by remember { mutableStateOf<Bitmap?>(null) }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      val f = File(context.filesDir, "custom_lince_wallpaper.jpg")
                      if (f.exists()) {
                          val bmp = BitmapFactory.decodeFile(f.absolutePath)
                          withContext(Dispatchers.Main) { customWallpaperBitmap = bmp }
                      }
                  }
              }

              val galleryLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      try {
                          context.contentResolver.openInputStream(uri)?.use { stream ->
                              val bmp = BitmapFactory.decodeStream(stream)
                              if (bmp != null) {
                                  customWallpaperBitmap = bmp
                                  wallpaperStyle = "custom_gallery"
                                  prefs.edit().putString("wallpaper_style", "custom_gallery").apply()
                                  FileOutputStream(File(context.filesDir, "custom_lince_wallpaper.jpg")).use { out ->
                                      bmp.compress(Bitmap.CompressFormat.JPEG, 90, out)
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              var iconPackMode by remember { mutableStateOf(prefs.getString("icon_pack", "black_essence") ?: "black_essence") }
              var textColorMode by remember { mutableStateOf(prefs.getString("text_color_mode", "dark") ?: "dark") }
              var fontMode by remember { mutableStateOf(prefs.getString("font_mode", "sans") ?: "sans") }
              // 1=Orejas Lince Claro, 2=Huella Lince Clara, 3=Niagara Semana 05, 4=Solar Egipcio Ra, 5=Cartucho Faraónico, 6=KWGT Cartel Dorado, 7=KWGT Reloj Blanco, 8=KWGT 15 Olas, 9=Reloj Grande
              var clockType by remember { mutableStateOf(prefs.getInt("clock_type", 1)) }
              var waveColorMode by remember { mutableStateOf(prefs.getString("wave_color_mode", "rainbow") ?: "rainbow") }
              var hideAlphabet by remember { mutableStateOf(prefs.getBoolean("hide_alphabet", false)) }
              var hideFavoriteNames by remember { mutableStateOf(prefs.getBoolean("hide_fav_names", false)) }
              var showLinceButton by remember { mutableStateOf(prefs.getBoolean("show_lince_btn", true)) }
              var waveOnLeft by remember { mutableStateOf(prefs.getBoolean("wave_left", false)) }
              var iconSizeDp by remember { mutableStateOf(prefs.getFloat("icon_size", 42f)) }
              var verticalOffsetDp by remember { mutableStateOf(prefs.getFloat("vertical_offset", 14f)) }
              var isMovingWidgetMode by remember { mutableStateOf(false) }

              var favoritePackages by remember { mutableStateOf(prefs.getStringSet("favorites", null)?.toSet() ?: emptySet()) }
              var apps by remember { mutableStateOf<List<AppItem>>(emptyList()) }
              var searchQuery by remember { mutableStateOf("") }
              var favSearchQuery by remember { mutableStateOf("") }
              var isSearching by remember { mutableStateOf(false) }

              var showQuickSheet by remember { mutableStateOf(false) }
              var showClockPicker by remember { mutableStateOf(false) }
              var showWaveColorPicker by remember { mutableStateOf(false) }
              var selectedAppForMenu by remember { mutableStateOf<AppItem?>(null) }

              var activeChar by remember { mutableStateOf('★') }
              var activeWaveIndex by remember { mutableStateOf<Int?>(null) }
              var touchY by remember { mutableStateOf<Float?>(null) }
              var containerSize by remember { mutableStateOf(IntSize(1080, 2400)) }

              val listState = rememberLazyListState()
              var currentTime by remember { mutableStateOf("") }
              var currentDateShort by remember { mutableStateOf("") }
              var currentDayName by remember { mutableStateOf("JUEVES") }
              var currentDayNumber by remember { mutableStateOf("05") }
              var currentWeekNumber by remember { mutableStateOf(45) }
              var batteryLevel by remember { mutableStateOf(100) }
              var hourFloat by remember { mutableStateOf(10f) }
              var minuteFloat by remember { mutableStateOf(10f) }

              LaunchedEffect(Unit) {
                  while (true) {
                      val now = Date()
                      val cal = Calendar.getInstance()
                      currentTime = DateFormat.format("HH:mm", now).toString()
                      currentDateShort = DateFormat.format("EEE, d MMM", now).toString()
                      currentDayName = DateFormat.format("EEEE", now).toString().uppercase()
                      currentDayNumber = DateFormat.format("dd", now).toString()
                      currentWeekNumber = cal.get(Calendar.WEEK_OF_YEAR)
                      hourFloat = (cal.get(Calendar.HOUR) + cal.get(Calendar.MINUTE) / 60f)
                      minuteFloat = cal.get(Calendar.MINUTE).toFloat()
                      batteryLevel = getBatteryPercentage(context)
                      delay(1000L)
                  }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      val pm = context.packageManager
                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                      val loadedApps = pm.queryIntentActivities(mainIntent, 0).mapNotNull { ri ->
                          val pkg = ri.activityInfo.packageName
                          if (pkg == context.packageName) return@mapNotNull null
                          val label = ri.loadLabel(pm)?.toString()?.trim() ?: pkg
                          val firstChar = if (label.isNotEmpty()) label[0].uppercaseChar() else '#'
                          val initial = if (firstChar in 'A'..'Z') firstChar else '#'
                          AppItem(label, pkg, drawableToBitmap(ri.loadIcon(pm)), initial)
                      }.sortedBy { it.label.lowercase() }

                      withContext(Dispatchers.Main) {
                          apps = loadedApps
                          if (favoritePackages.isEmpty() && loadedApps.isNotEmpty()) {
                              val defaultFavs = loadedApps.take(6).map { it.packageName }.toSet()
                              favoritePackages = defaultFavs
                              prefs.edit().putStringSet("favorites", defaultFavs).apply()
                          }
                      }
                  }
              }

              val appFontFamily = remember(fontMode) {
                  when (fontMode) {
                      "serif" -> FontFamily.Serif
                      "mono" -> FontFamily.Monospace
                      else -> FontFamily.SansSerif
                  }
              }

              val isLightBackground = wallpaperStyle == "lince_sol_claro" || wallpaperStyle == "lince_marisma_clara" || wallpaperStyle == "split_waves"
              val isDarkText = textColorMode == "dark" || isLightBackground
              val primaryTextColor = if (isDarkText) Color(0xFF111827) else Color(0xFFFFFFFF)
              val accentColor = getWaveLetterColor(4, waveColorMode, Color(0xFFFF9100))
              val dialogBgColor = Color(0xFF1E293B)

              if (currentScreen == "WELCOME") {
                  Box(
                      modifier = Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Color(0xFF38BDF8), Color(0xFF0284C7), Color(0xFF0369A1)))).statusBarsPadding().navigationBarsPadding().padding(28.dp)
                  ) {
                      Column(modifier = Modifier.fillMaxSize(), verticalArrangement = Arrangement.SpaceBetween) {
                          Spacer(modifier = Modifier.height(20.dp))
                          Column {
                              Text("Lince Ibérico, Niagara & Egipto", color = Color(0xFFFFEA00), fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)
                              Spacer(modifier = Modifier.height(14.dp))
                              Text("Nuevos temas claros y soleados del Lince Ibérico, todos los temas clásicos de Niagara Launcher y barra de letras personalizable en colores vivos.", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Medium)
                          }
                          Button(
                              onClick = { currentScreen = "FAVORITES" },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFEA00)),
                              shape = RoundedCornerShape(28.dp),
                              modifier = Modifier.fillMaxWidth().height(56.dp)
                          ) {
                              Text("Elegir aplicaciones favoritas  🐾 🌈", color = Color.Black, fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)
                          }
                      }
                  }
                  return
              }

              if (currentScreen == "FAVORITES") {
                  val filtered = remember(apps, favSearchQuery) {
                      if (favSearchQuery.isBlank()) apps else apps.filter { it.label.contains(favSearchQuery.trim(), ignoreCase = true) }
                  }
                  Column(modifier = Modifier.fillMaxSize().background(Color(0xFF0F172A)).statusBarsPadding().navigationBarsPadding()) {
                      Column(modifier = Modifier.fillMaxWidth().background(Color(0xFF1E293B)).padding(18.dp)) {
                          Text("Tus Favoritos (${favoritePackages.size} marcadas)", color = Color(0xFF38BDF8), fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.height(10.dp))
                          Row(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(Color.White.copy(alpha = 0.14f)).padding(horizontal = 14.dp, vertical = 10.dp), verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Default.Search, contentDescription = null, tint = Color.White, modifier = Modifier.size(18.dp))
                              Spacer(modifier = Modifier.width(8.dp))
                              BasicTextField(
                                  value = favSearchQuery,
                                  onValueChange = { favSearchQuery = it },
                                  singleLine = true,
                                  textStyle = TextStyle(color = Color.White, fontSize = 15.sp),
                                  cursorBrush = SolidColor(Color.White),
                                  modifier = Modifier.weight(1f),
